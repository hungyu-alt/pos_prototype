<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<!-- 從 iPad 主畫面開啟時以全螢幕顯示；網頁延伸到系統狀態列底下（black-translucent），由 .statusbar-area 自行畫狀態列底色，遮罩才能蓋住狀態列。
     iPad 11 吋 iPadOS 26 實測：延伸後 innerHeight 為 820（正確），但 documentElement.clientHeight 為 788（少了狀態列高度），
     fixed 元素與 100% 高度都依 788 計算，底部會被裁掉；故外層不用 fixed，並由 fit() 把 html、body 高度設為 innerHeight -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桌位圖・拖曳換桌</title>
<!--
  桌位圖・拖曳換桌 prototype
  依 reference/claude-design-source.html 逐行重建為單一獨立 HTML（純 JavaScript、無外部依賴）。
  規格見 SPEC.md。色碼、字級等數值集中於下方 :root。
-->
<style>
:root{
  /* 字型 */
  --font-family:-apple-system,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;

  /* 品牌色 */
  --c-primary:#1592A8;
  --c-primary-dark:#0C4C5B;
  --c-primary-tint:rgba(21,146,168,.06);

  /* 中性色 */
  --c-white:#fff;
  --c-page-bg:#E4E4E6;
  --c-text-strong:#111;
  --c-text:#222;
  --c-text-secondary:#333;
  --c-text-tertiary:#555;
  --c-line:#EBEBEB;
  --c-fill:#F2F2F2;

  /* 桌況狀態 */
  /* 依 Figma 設計稿；圓點（篩選 chip、Popover 狀態）與桌位底色同色 */
  --st-empty-bg:#fff;     --st-empty-fg:#000;   --st-empty-dot:#fff;    --st-empty-border:#4D4D4D;
  --st-seated-bg:#ABBBDE; --st-seated-fg:#000;  --st-seated-dot:var(--st-seated-bg);
  --st-cooking-bg:#EDC73E;--st-cooking-fg:#000; --st-cooking-dot:var(--st-cooking-bg);
  --st-served-bg:#26A554; --st-served-fg:#fff;  --st-served-dot:var(--st-served-bg);
  --st-leaving-bg:#34466B;--st-leaving-fg:#fff; --st-leaving-dot:var(--st-leaving-bg);

  /* 桌位互動強調色（選取外圈、放開目標外圈、拖曳卡） */
  --c-table-accent:#0092B1;

  /* 待確認標籤 */
  --c-pending-bg:#ED4660;
  --c-pending-fg:#fff;

  /* 佔桌計時：超時標籤（依 Figma「佔桌計時模式」） */
  --c-overtime-bg:#D92D20;
  --c-overtime-fg:#fff;

  /* 桌位圖顯示設定選單（依 Figma「佔桌計時模式」） */
  --c-menu-bg:#F2F2F7;
  --c-menu-head:var(--c-op-primary);
  --c-menu-on-head:#fff;
  --c-menu-row:#fff;
  --c-menu-line:#EDEDED;
  --c-menu-text:#000;
  --c-menu-active:var(--c-op-primary);
  --sh-menu:2px 4px 12px rgba(0,0,0,.25);

  /* 標籤選單與標籤篩選（依 Figma「查看特定標籤桌」） */
  --c-tag-chip-bg:var(--c-op-container);
  --c-tag-chip-fg:var(--c-op-text);
  /* 選中同桌況篩選 chip（R16），文字前加勾表示可複選（偏離 Figma，已討論提案） */
  --c-tag-chip-active-bg:var(--c-chip-active-bg);
  --bd-tag-chip-active:var(--bd-chip-active);
  --c-tag-chip-check:var(--c-op-primary);
  --c-tag-count-bg:var(--c-op-primary);
  --c-tag-count-fg:#fff;
  --sh-tag-menu:2px 4px 2px rgba(0,0,0,.25);
  --op-tag-dim:.3;

  /* 上方操作列（導覽列＋篩選列，依 Figma 設計稿） */
  --c-op-primary:#0092B1;
  --c-op-primary-border:#54B6CB;
  --c-op-on-primary:#fff;
  --c-op-badge-on-light:#000;
  --c-nav-bg:#FBFAFD;
  --c-op-line:#E6E6E6;
  --c-op-container:#EBEBEB;
  --c-op-on-container:#1A1A1A;
  --c-op-text:#333;
  --c-op-text-variant:#4D4D4D;
  --fs-op-floor-tab:16px;
  --fs-op-label:14px;
  --fs-op-badge:10px;
  /* 導覽列按鈕、清除條件（依 Figma Design system：Primary、Primary Outline、Text button） */
  --fs-op-button:16px;
  --c-op-primary-pressed:#00687E;
  --c-op-primary-container:#E6F4F7;

  /* 導覽列樓層頁籤 */
  --c-floor-tab-active-bg:var(--c-op-text); --c-floor-tab-active-fg:#fff;
  --c-floor-tab-bg:var(--c-op-container);   --c-floor-tab-fg:var(--c-op-on-container);
  --c-floor-tab-border:var(--c-op-line);

  /* 篩選 chip */
  --c-chip-bg:var(--c-op-container);
  --c-chip-active-bg:#E4F4F7;

  /* 桌位圖 */
  --c-obstacle-bg:#EFEFEF;
  --c-obstacle-fg:#8A8A8A;
  --c-mini-grid:#E6E6E6;
  --c-pop-hint-bg:#E8F5F7;
  --c-drag-hint-bg:#B0DDE7;
  --c-drag-hint-fg:#003D4A;
  --fs-drag-hint:16px;
  --c-ghost-icon-back:#00687E;
  /* 多筆訂單換桌視窗（選擇要換桌的訂單、加入有人桌、移至空桌；依 Figma） */
  --c-mv-meta:#B2B2B2;
  --c-mv-check:#000;
  --c-mv-off:#000;
  --fs-mv-order:18px;
  --op-mv-disabled:.4;
  /* 候位選桌模式鎖定：導覽列設定圖示不可點 */
  --op-nav-locked:.4;
  /* 候位選桌模式鎖定：「候位」按鈕停用樣式（依 Figma 截圖估算） */
  --c-nav-btn-disabled-bg:#E6E6E6;
  --c-nav-btn-disabled-fg:#B2B2B2;
  /* 訂單卡的訂單板圖示（依 Figma） */
  --c-ghost-order-head:#B0DDE7;
  --c-ghost-order-clip:#003D4A;
  --c-ghost-order-clip-base:#005061;
  --c-ghost-order-bullet:#0092B1;
  --c-ghost-order-line:#54B6CB;
  --fx-ghost-order-icon:drop-shadow(0 1px 2px rgba(0,0,0,.18));

  /* Toast */
  --c-toast-bg:#1C1C1E;
  --c-toast-fg:#fff;

  /* 合併 Alert */
  --c-scrim:rgba(0,0,0,.32);

  /* 底部頁籤列 */
  --c-tab-active-bg:#EEF0F2;

  /* 系統狀態列底下的區域（網頁延伸到狀態列底下，自行畫底色） */
  --c-statusbar-bg:#FFFFFF;

  /* 候位清單（依 Figma 設計稿） */
  --c-wl-scrim:rgba(0,0,0,.5);
  --c-wl-bg:var(--c-white);
  --c-wl-text:#000;
  --c-wl-text-variant:var(--c-op-text-variant);
  --c-wl-action:var(--c-op-primary);
  --c-wl-highlight:var(--c-pending-bg);
  --c-wl-divider:var(--c-op-line);
  --c-wl-num-bg:var(--c-op-container);
  --c-wl-num-fg:var(--c-op-on-container);
  --c-wl-search-bg:rgba(120,120,128,.12);
  --c-wl-search-fg:rgba(60,60,67,.6);
  --fs-wl-title:16px;
  --fs-wl-name:16px;
  --fs-wl-body:14px;
  --fs-wl-meta:12px;
  --fs-wl-search:17px;

  /* 新增候位視窗（依 Figma 設計稿） */
  --c-wla-bg:#F2F2F2;
  --c-wla-card:var(--c-white);
  --c-wla-nav-bg:rgba(255,255,255,.75);
  --c-wla-nav-border:rgba(0,0,0,.3);
  --c-wla-separator:rgba(84,84,86,.34);
  --c-wla-placeholder:rgba(60,60,67,.3);
  --c-wla-subtitle:var(--c-op-text-variant);
  --c-wla-chip-bg:var(--c-op-container);
  --c-wla-chip-fg:var(--c-op-on-container);
  --c-wla-chip-active-bg:var(--c-op-primary);
  --c-wla-chip-active-fg:var(--c-white);
  --c-wla-tag-fg:var(--c-op-text);
  --c-wla-stepper-bg:rgba(120,120,128,.12);
  --c-wla-stepper-line:rgba(60,60,67,.3);
  --c-wla-error:#D92D20;
  --c-wla-error-bg:#FBEAE9;
  --c-wla-on-error:var(--c-white);
  --c-wla-required:#ED4660;
  --fs-wla-nav-title:17px;
  --fs-wla-body:16px;
  --fs-wla-label:14px;
  --fs-wla-badge:12px;

  /* 搜尋會員視窗、會員卡片（依 Figma 設計稿） */
  --c-wlm-header-bg:var(--c-op-primary);
  --c-wlm-header-fg:var(--c-white);
  --c-wlm-search-bg:#EFEFF0;
  --c-wlm-search-fg:#848488;
  --c-wlm-seg-bg:#0E8EAB;
  --c-wlm-seg-active-bg:var(--c-white);
  --c-wlm-seg-active-fg:#808080;
  --c-wlm-seg-divider:#238AA3;
  --sh-wlm-seg-active:0 3px .5px rgba(0,0,0,.04), 0 3px 4px rgba(0,0,0,.12);
  --c-wlm-section-bg:#EDEDED;
  --c-wlm-section-border:#A6A6A6;
  --c-wlm-section-fg:#838387;
  --c-wlm-row-border:#DDDDDE;
  --c-wlm-row-sub:#8E8E93;
  --c-member-card-bg:#F2F2F2;
  --c-member-badge-bg:#B0DDE7;
  --c-member-badge-fg:#003D4A;
  --c-member-divider:#CCCCCC;
  --c-wla-toast-bg:#1A1A1A;
  --c-wla-toast-fg:var(--c-white);

  /* 候位左滑操作按鈕、取消候位 Alert（依 Figma，iOS 原生樣式） */
  --c-wl-swipe-edit:#AEAEB2;
  --c-wl-swipe-qr:#FF9500;
  --c-wl-swipe-cancel:#FF3B30;
  --c-wl-swipe-fg:var(--c-white);
  --w-wl-swipe-action:96px;
  --sz-wl-swipe-icon:28px;
  --dur-wl-swipe:.2s;
  --dur-wl-remove:.25s;
  --c-ios-alert-bg:rgba(242,242,242,.92);
  --c-ios-alert-line:rgba(60,60,67,.29);
  --c-ios-alert-action:#007AFF;
  --c-ios-alert-destructive:#D92D20;
  --fs-ios-alert-title:17px;
  --fs-ios-alert-msg:13px;
  --fs-wlm-title:17px;
  --fs-wlm-seg:13px;
  --fs-wlm-row:17px;
  --fs-wlm-row-sub:13px;
  /* 會員資料視窗（R65，依現有會員資料視窗截圖） */
  --c-mi-toolbar-bg:#F7F7F7;
  --c-mi-toolbar-line:#D9D9DC;
  --c-mi-section-bg:#EFEFF4;
  --c-mi-section-fg:#6D6D72;
  --c-mi-value:var(--c-op-primary);
  --c-mi-value-muted:#8E8E93;
  --c-mi-pin:#3C3C43;
  --c-mi-chevron:#C4C4C7;
  --fs-mi-row:17px;
  --fs-mi-section:13px;

  /* 桌卡（點擊佔桌的桌）：表單區沿用新增候位的樣式 */
  --c-tc-scrim:var(--c-wl-scrim);
  --c-tc-danger:var(--c-wla-error);
  --c-tc-value:var(--c-op-text-variant);
  --c-tc-hint-btn:#000;
  --fs-tc-hint-btn:14px;
  --op-tc-note-placeholder:.38;
  /* 桌卡的待確認訂單卡（依 Figma；品項紅字同待確認標籤） */
  --c-tc-order-head-bg:#FF8E00;
  --c-tc-order-head-fg:rgba(255,255,255,.7);
  --c-tc-order-pending:var(--c-pending-bg);
  --fs-tc-order-title:20px;
  /* 桌卡的一般訂單卡（出餐中、已出餐）與待離桌畫面（依 Figma） */
  --c-tc-order-paid-bg:#007AD8;
  --c-tc-order-paid-fg:var(--c-white);
  --c-tc-order-cust-bg:#D9D9D9;
  --c-tc-order-item-bg:#FDEABA;
  --c-tc-done-placeholder:#D9D9D9;
  --fs-tc-done:14px;
  /* 空桌桌卡（一般掃碼點餐）：進階設定開關（依 Figma iOS Toggle） */
  --c-tc-toggle-on:var(--c-op-primary);
  --c-tc-toggle-off:rgba(120,120,128,.16);
  --c-tc-toggle-knob:var(--c-white);
  --sh-tc-toggle-knob:0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06);
  --fs-tc-expand:14px;

  /* 框線 */
  --bd-table:2px solid transparent;
  /* 空桌虛線：線段 2px、間隔 6px，框線畫在桌內側（依 Figma；CSS dashed 無法指定線段長度，改以 SVG 繪製；間隔由 evenDash 依一圈長度微調） */
  --bd-table-empty-width:2px;
  --bd-table-empty-dash:2 6;
  /* 篩選列「空桌」圓點：白底＋2px 黑色虛線，線段 2px、間隔 2px，畫在內側（依 Figma） */
  --bd-chip-dot-empty-color:#000;
  --bd-chip-dot-empty-dash:2 2;
  --bd-chip-active:1.5px solid var(--c-op-primary);

  /* 陰影 */
  --sh-popover:0 10px 36px rgba(0,0,0,.18);
  --sh-minimap:0 4px 16px rgba(0,0,0,.14);
  --sh-ghost:0 4px 16px rgba(0,0,0,.16);
  --sh-toast:0 8px 24px rgba(0,0,0,.2);
  --sh-wl-panel:0 0 20px 4px rgba(0,0,0,.12);
  --sh-tc:0 15px 75px rgba(0,0,0,.18);
  --sh-table-selected:0 0 0 4px var(--c-white), 0 0 0 7px var(--c-table-accent);
  --sh-table-drop-empty:0 0 0 4px var(--c-white), 0 0 0 10px var(--c-table-accent);
  --sh-table-drop-merge:0 0 0 4px var(--c-white), 0 0 0 8px var(--c-table-accent);
  /* 空桌陰影用 box-shadow 而非 filter：filter 與 box-shadow 動畫並存時，Safari 會殘留外圈陰影 */
  --sh-table-empty:0 4px 8px rgba(0,0,0,.16);

  /* 字級 */
  --fs-table-name:20px;
  --fs-table-guests:12px;
  --fs-table-pending:12px;
  --fs-table-time:12px;
  --fs-menu:18px;
  --fs-tag-count:10px;

  /* 動畫 */
  --dur-fast:.15s;
  --dur-base:.2s;
  --dur-wl:.25s;
  --dur-seat-breathe:1.6s;   /* 候位開桌選桌模式：空桌外框呼吸動態一循環 */
  --seat-breathe-scale:1.06;  /* 呼吸時外框最大縮放（桌子本身不縮放） */
  --dur-wla-swap:.3s;   /* 新增候位：手填欄位與會員卡片切換（收合＋淡入淡出） */
  --dur-long-press:300ms;   /* 長按多久拿起拖曳卡（JS 也讀這個值） */
  --dur-card-pop:.2s;
  /* 落桌回饋（R64）：開桌、換桌、合併完成後目標桌輕彈＋光圈擴散一次（JS 讀 delay 與 total） */
  --land-delay:.2s;         /* 等視窗關閉、淡化恢復後才開始播 */
  --land-pop-scale:1.08;
  --dur-land-pop:.3s;
  --land-ring-width:3px;
  --land-ring-scale:1.35;
  --dur-land-ring:.6s;
  --dur-land-static:1s;     /* 減少動態效果：靜態外框淡出 */

  /* 拖曳卡位置：顯示在手指正上方，避免被手指擋住（JS 也讀這兩個值） */
  --ghost-gap:28px;      /* 卡片底部與觸點的距離 */
  --ghost-top-min:60px;  /* 卡片頂端最高到這裡（提示列 52px 下方留 8px），手指太靠上時卡片改為往下貼齊 */

  /* 長按回饋：按下縮放 */
  --press-scale:.90;
}

html,body{margin:0;height:100%;background:var(--c-page-bg);overflow:hidden;font-family:var(--font-family);-webkit-font-smoothing:antialiased}
a{color:var(--c-primary)}a:hover{color:var(--c-primary-dark)}
*{box-sizing:border-box}

/* 純結構用容器，不參與版面 */
.slot{display:contents}

/* 縮放（不加 iPad 外框；關閉 iPad Safari 長按選單與點擊閃爍） */
/* 不用 position:fixed：iPadOS 26 主畫面模式的 fixed 元素依 clientHeight（少了狀態列高度）裁切，底部會被截掉；高度由 JS 設定 */
.stage{position:absolute;top:0;left:0;right:0;height:100%;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.device{width:1180px;flex-shrink:0;transform-origin:center}
/* 寬 1180；高度由 JS 依視窗設定（填滿視窗，介於 SCREEN_MIN_H 與 SCREEN_MAX_H 之間） */
.screen{position:relative;width:1180px;height:820px;background:var(--c-white);overflow:hidden;display:flex;flex-direction:column}
/* 系統狀態列底下的區域（高度＝狀態列高度，由 JS 設定；Safari 分頁模式為 0） */
.statusbar-area{flex-shrink:0;height:0;background:var(--c-statusbar-bg)}


/* 導覽列 */
.navbar{height:61px;flex-shrink:0;background:var(--c-nav-bg);border-bottom:1px solid var(--c-op-line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.nav-left{display:flex;gap:16px;align-items:center}
.nav-right{display:flex;gap:16px;align-items:center}
.nav-actions{display:flex;gap:12px;align-items:center}
.op-icon{display:block;flex-shrink:0}
/* 分隔線在 Figma 中寬度為 0（線條置中於該位置），不占版面寬度 */
.op-divider{margin:0 -0.5px}
.floor-tab{padding:4px 12px;border-radius:100px;display:flex;align-items:center;font-size:var(--fs-op-floor-tab);line-height:24px;font-weight:500;white-space:nowrap;cursor:pointer}
/* Figma 框線畫在內側，故內距扣掉 1px 框線 */
.nav-btn{padding:7px 11px;border-radius:100px;border:1px solid;display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-op-label);line-height:20px;font-weight:500;white-space:nowrap}
.nav-btn-secondary{background:var(--c-white);border-color:var(--c-op-primary);color:var(--c-op-primary)}
.nav-btn-primary{background:var(--c-op-primary);border-color:var(--c-op-primary-border);color:var(--c-op-on-primary)}
.nav-btn-badge{height:20px;min-width:20px;padding:0 4px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-op-badge);line-height:12px;font-weight:500}
.nav-btn-secondary .nav-btn-badge{background:var(--c-op-primary);color:var(--c-op-on-primary)}
.nav-btn[data-act]{cursor:pointer}
.nav-btn-primary .nav-btn-badge{background:var(--c-white);color:var(--c-op-badge-on-light)}
/* 導覽列「桌號未定」「候位」：16px（行高 24）、高 40；「候位」無外框（框線同底色）；按下時改 pressed 色 */
.nav-actions .nav-btn{font-size:var(--fs-op-button);line-height:24px}
.nav-actions .nav-btn-primary{border-color:var(--c-op-primary)}
.nav-actions .nav-btn-secondary:active{background:var(--c-op-primary-container);border-color:var(--c-op-primary-pressed);color:var(--c-op-primary-pressed)}
.nav-actions .nav-btn-primary:active{background:var(--c-op-primary-pressed);border-color:var(--c-op-primary-pressed)}

/* 篩選列 */
.filterbar{height:53px;flex-shrink:0;background:var(--c-white);border-bottom:1px solid var(--c-op-line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.filter-left{display:flex;gap:12px;align-items:center}
.chip{padding:4px 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-op-label);line-height:20px;font-weight:500;color:var(--c-op-text);white-space:nowrap;cursor:pointer}
.chip-dot{width:10px;height:10px;border-radius:100px}
.chip-dot-empty{display:block;flex-shrink:0;overflow:visible;fill:var(--st-empty-dot);stroke:var(--bd-chip-dot-empty-color);stroke-width:2px;stroke-dasharray:var(--bd-chip-dot-empty-dash)}
.dropdown{padding:4px 4px 4px 8px;border-radius:8px;background:var(--c-op-container);display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-op-label);line-height:20px;font-weight:500;color:var(--c-op-on-container);white-space:nowrap}
.dropdown-tag,.dropdown-seat{cursor:pointer}
/* 清除條件：有桌況篩選或標籤條件時才顯示（依 Figma「快速清除所選條件」） */
.filter-clear{padding:4px 10px;font-size:var(--fs-op-button);line-height:24px;font-weight:500;color:var(--c-op-primary);white-space:nowrap;cursor:pointer}
.filter-clear:active{color:var(--c-op-primary-pressed)}
/* 標籤下拉：有勾選時在文字與箭頭間顯示勾選數量 */
.dropdown-count{height:20px;min-width:28px;padding:0 4px;border-radius:100px;background:var(--c-tag-count-bg);color:var(--c-tag-count-fg);font-size:var(--fs-tag-count);line-height:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.filter-total{font-size:var(--fs-op-label);line-height:16px;color:var(--c-op-text-variant);white-space:nowrap}

/* 桌位圖 */
.floor{position:relative;flex:1;overflow:hidden;background:var(--c-white);touch-action:none}
/* 可平移的畫布（以 transform 位移；Popover 放在畫布外，維持疊在小地圖之上） */
.canvas{position:absolute;left:0;top:0;width:2360px;height:1240px;will-change:transform}
.obstacle{position:absolute;background:var(--c-obstacle-bg);color:var(--c-obstacle-fg);font-size:13px;display:flex;align-items:center;justify-content:center}

.table{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:none;transition:transform var(--dur-fast),box-shadow var(--dur-fast),opacity var(--dur-base),background var(--dur-base)}
/* 空桌「＋」與桌名之間無間距 */
.table-plus{display:block;flex-shrink:0;margin-bottom:-4px}
/* 空桌虛線框：蓋滿整張桌（含 2px 透明框線） */
.table-dash{position:absolute;inset:-2px;overflow:visible;fill:none;stroke:var(--st-empty-border);stroke-width:var(--bd-table-empty-width);stroke-dasharray:var(--bd-table-empty-dash)}
/* 長按桌上的圖片時，iPad Safari 會啟動系統拖放並接走觸控，造成放開手指的事件收不到；圖片一律不可拖放、不接收觸控 */
.table img,.table svg{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.table-name{max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-table-name);line-height:24px;font-weight:600;text-align:center}
.table-guests{display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-table-guests);line-height:16px;font-weight:500}
.table-guests-icon{display:block;flex-shrink:0}
/* 設計稿為距桌位外緣 -4px；桌位有 2px 框線（空桌虛線、其他透明），故再減 2px */
.table-pending{position:absolute;left:-6px;top:-6px;padding:4px 8px;border-radius:100px;background:var(--c-pending-bg);border:1.5px solid var(--c-pending-fg);color:var(--c-pending-fg);font-size:var(--fs-table-pending);line-height:16px;font-weight:500;white-space:nowrap}
/* 佔桌計時：時間列（時鐘圖示＋時間，與人數同字級）；超時改顯示左下角紅色膠囊（依 Figma 距桌位外緣左 -12px、下 -4px，再扣 2px 框線） */
.table-time{display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-table-time);line-height:16px;font-weight:500}
.table-time svg,.table-overtime svg{display:block;flex-shrink:0}
.table-overtime{position:absolute;left:-14px;bottom:-6px;height:24px;padding:0 4px;border-radius:100px;background:var(--c-overtime-bg);border:1.5px solid var(--c-overtime-fg);color:var(--c-overtime-fg);font-size:var(--fs-table-time);line-height:16px;font-weight:500;white-space:nowrap;display:flex;align-items:center}
.table-badge{position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;height:26px;padding:0 12px;border-radius:13px;background:var(--c-primary-dark);color:var(--c-white);font-size:13px;font-weight:600;display:flex;align-items:center}

/* Popover */
.popover{position:absolute;width:240px;background:var(--c-white);border-radius:14px;box-shadow:var(--sh-popover);padding:16px;display:flex;flex-direction:column;gap:10px;z-index:5}
.popover-head{display:flex;align-items:center;justify-content:space-between}
.popover-title{font-size:18px;font-weight:700;color:var(--c-text-strong)}
.popover-status{height:22px;padding:0 8px;border-radius:11px;font-size:12px;display:flex;align-items:center;gap:5px;background:var(--c-fill);color:var(--c-text-secondary)}
.popover-status-dot{width:8px;height:8px;border-radius:50%}
.popover-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;color:var(--c-text-tertiary)}
.popover-val{color:var(--c-text-strong);text-align:right}
.popover-amount{font-weight:700}
.popover-hint{font-size:12px;color:var(--c-primary);background:var(--c-pop-hint-bg);border-radius:8px;padding:8px 10px}
.popover-cap{font-size:14px;color:var(--c-text-tertiary)}
.popover-open{height:40px;border-radius:10px;background:var(--c-primary);color:var(--c-white);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* 桌位圖顯示設定選單：三角形尖端對準設定圖示下方，位置依 Figma（三角形頂端距導覽列頂 45px） */
.settings-btn{cursor:pointer}
/* 候位選桌模式鎖定（R48）：不提供「桌號未定」（保留位置）；「候位」為停用樣式（灰底灰字、徽章不變）、不可點；設定圖示不可點 */
.screen.is-seat-lock .nav-actions .nav-btn-secondary{visibility:hidden}
.screen.is-seat-lock #waitlistBtn{background:var(--c-nav-btn-disabled-bg);border-color:var(--c-nav-btn-disabled-bg);color:var(--c-nav-btn-disabled-fg);pointer-events:none}
.screen.is-seat-lock .settings-btn{opacity:var(--op-nav-locked);pointer-events:none}
/* 換桌選桌模式鎖定（R55）：「候位」按鈕外觀不變、點了沒反應 */
.screen.is-swap-lock #waitlistBtn{pointer-events:none}
.settings-menu{position:absolute;left:16px;top:calc(var(--safe-top, 0px) + 45px);width:263px;z-index:20;filter:drop-shadow(var(--sh-menu))}
.settings-arrow{position:absolute;left:10px;top:0;width:24px;height:14px;background:var(--c-menu-head);clip-path:polygon(50% 0,100% 100%,0 100%)}
.settings-card{margin-top:13px;border-radius:12px;overflow:hidden;background:var(--c-menu-bg);padding-bottom:16px}
.settings-head{position:relative;height:50px;background:var(--c-menu-head);color:var(--c-menu-on-head);display:flex;align-items:center;justify-content:center;padding:0 36px;font-size:var(--fs-menu);line-height:22px;font-weight:600;white-space:nowrap}
.settings-back{position:absolute;left:8px;top:15px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.settings-gap{height:16px}
.settings-row{height:48px;background:var(--c-menu-row);display:flex;align-items:center;padding-left:4px;cursor:pointer}
.settings-check{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--c-menu-text);visibility:hidden}
.settings-row.is-active .settings-check{visibility:visible}
.settings-label{flex:1;align-self:stretch;margin-left:4px;display:flex;align-items:center;font-size:var(--fs-menu);line-height:22px;font-weight:500;color:var(--c-menu-text);white-space:nowrap}
.settings-row.is-active .settings-label{color:var(--c-menu-active)}
.settings-row:not(:last-child) .settings-label{border-bottom:1px solid var(--c-menu-line)}
/* 第一層：無勾選欄（標題左側空 28px），右側箭頭 */
.settings-root .settings-check{width:28px}
.settings-root .settings-label{padding-right:4px}
.settings-root .settings-row:not(:last-child) .settings-label{border-bottom:none}
.settings-root .settings-label-text{flex:1;align-self:stretch;display:flex;align-items:center;border-bottom:1px solid var(--c-menu-line)}
.settings-chevron{display:block;flex-shrink:0;margin-left:4px}

/* 標籤選單：外觀同桌位圖顯示設定選單；位置依「標籤」下拉計算（選單左緣＝下拉左緣 +17px、三角形尖端＝下拉左緣 +41px、三角形頂端距下拉底 6px，依 Figma） */
.tag-menu{position:absolute;width:263px;z-index:20;filter:drop-shadow(var(--sh-tag-menu))}
.tag-menu .settings-arrow{left:12px}
.tag-list{background:var(--c-menu-row);padding:12px;display:flex;flex-wrap:wrap;gap:12px}
.tag-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:var(--c-tag-chip-bg);color:var(--c-tag-chip-fg);font-size:var(--fs-op-label);line-height:20px;font-weight:500;white-space:nowrap;cursor:pointer}
.tag-chip.is-active{padding:2.5px 6.5px;background:var(--c-tag-chip-active-bg);border:var(--bd-tag-chip-active)}
.tag-chip-check{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--c-tag-chip-check)}
.tag-chip-check svg{width:14px;height:auto}
/* 座位數選單（R61）：外觀同桌位圖顯示設定選單；選單左緣＝「座位數」下拉左緣 +44px、三角形頂端距下拉底 6px（依 Figma） */
.seat-menu{position:absolute;width:263px;z-index:20;filter:drop-shadow(var(--sh-menu))}
.seat-menu .settings-arrow{left:12px}
/* 特殊需求標籤池（R57）：外觀同標籤選單；三角形尖端對準「加入標籤」中央、頂端距按鈕底 6px；下方空間不足時改開在按鈕上方（三角形朝下） */
.needs-pool{position:absolute;width:263px;z-index:50;filter:drop-shadow(var(--sh-tag-menu))}
.needs-pool .settings-arrow{left:12px}
.needs-pool.is-up .settings-arrow{top:auto;bottom:0;background:var(--c-menu-bg);clip-path:polygon(0 0,100% 0,50% 100%)}
.needs-pool.is-up .settings-card{margin:0 0 13px}

/* 小地圖 */
.minimap{position:absolute;right:16px;bottom:16px;width:190px;height:100px;background:var(--c-white);border-radius:10px;box-shadow:var(--sh-minimap);overflow:hidden;pointer-events:none}
.minimap-grid-v{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--c-mini-grid)}
.minimap-grid-h{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--c-mini-grid)}
.minimap-viewport{position:absolute;border:2px solid var(--c-primary);border-radius:7px;background:var(--c-primary-tint)}

/* 拖曳中：跟手訂單卡 */
/* 位置由 JS 以 transform 設定：translate(x, y) rotate(-4deg) */
.ghost{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:10;will-change:transform}
/* .ghost 的原點即觸點；卡片水平置中、底部在觸點上方 --ghost-gap，彈出動畫從觸點長出 */
.ghost-card{position:absolute;left:-45px;bottom:var(--ghost-gap);width:90px;background:var(--c-white);border-radius:8px;box-shadow:var(--sh-ghost);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;transform-origin:50% calc(100% + var(--ghost-gap));animation:ghost-pop var(--dur-card-pop) cubic-bezier(.34,1.56,.64,1) both}
@keyframes ghost-pop{from{transform:scale(.6);opacity:0}}
.ghost-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;line-height:20px;font-weight:500;color:var(--c-text-strong)}
.ghost-icon{width:43px;height:43px;display:flex;align-items:center;justify-content:center}
.ghost-order-icon{filter:var(--fx-ghost-order-icon)}
.ghost-guests{display:flex;gap:2px;font-size:14px;line-height:20px;font-weight:500;color:var(--c-table-accent)}

/* 拖曳中：頂端提示列 */
.drag-hint{position:absolute;top:0;left:0;right:0;height:52px;background:var(--c-drag-hint-bg);color:var(--c-drag-hint-fg);font-size:var(--fs-drag-hint);line-height:24px;font-weight:500;display:flex;align-items:center;padding:0 16px;pointer-events:none;z-index:8}

/* Toast */
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);height:44px;padding:0 18px;border-radius:12px;background:var(--c-toast-bg);color:var(--c-toast-fg);font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-toast);z-index:20}

/* 底部頁籤列 */
.tabbar{height:64px;flex-shrink:0;border-top:1px solid var(--c-line);display:flex;justify-content:center;align-items:center;gap:14px}
.tab{width:76px;height:50px;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab-icon{width:18px;height:18px;border:2px solid}
.tab-label{font-size:11px}

/* 合併 Alert */

/* 候位清單：遮罩與面板為兄弟元素，點面板不會觸發遮罩的關閉 */
.wl-scrim{position:absolute;inset:0;background:var(--c-wl-scrim);z-index:40;animation:wl-fade-in var(--dur-wl) ease-out both}
/* 右緣位置由 JS 依「候位」按鈕設定；上緣距系統狀態列、下緣距底各 23px（--safe-top 由 JS 設定） */
.wl-panel{position:absolute;top:calc(var(--safe-top, 0px) + 23px);bottom:23px;width:400px;background:var(--c-wl-bg);border-radius:12px;box-shadow:var(--sh-wl-panel);display:flex;flex-direction:column;z-index:41;animation:wl-slide-in var(--dur-wl) ease-out both}
.wl-scrim.wl-closing{animation:wl-fade-out var(--dur-wl) ease-in both}
.wl-panel.wl-closing{animation:wl-slide-out var(--dur-wl) ease-in both}
@keyframes wl-fade-in{from{opacity:0}}
@keyframes wl-fade-out{to{opacity:0}}
@keyframes wl-slide-in{from{transform:translateX(520px)}}
@keyframes wl-slide-out{to{transform:translateX(520px)}}
/* 指向「候位」按鈕的三角形（Figma 為旋轉 90° 的白色多邊形）；面板下移 23px 後改放在頂端往下 4px，仍對準按鈕 */
.wl-arrow{position:absolute;left:395px;top:4px;width:16px;height:23px;background:var(--c-wl-bg);clip-path:polygon(0 0,100% 50%,0 100%)}
.wl-head{height:54px;flex-shrink:0;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
/* Figma 左側關閉圖示透明度為 0，只保留位置 */
.wl-head-spacer{width:24px;height:24px}
.wl-title{font-size:var(--fs-wl-title);line-height:24px;font-weight:600;color:var(--c-wl-text)}
.wl-text-btn{padding:4px 10px;font-size:var(--fs-op-button);line-height:24px;font-weight:500;color:var(--c-wl-action);white-space:nowrap;cursor:pointer}
/* 列上的「開桌」同「清除條件」（Figma Text button）：按下時改 pressed 色 */
.wl-item .wl-text-btn:active{color:var(--c-op-primary-pressed)}
.wl-head .wl-text-btn{font-size:var(--fs-wl-title);line-height:24px}
.wl-search{flex-shrink:0;padding:4px 12px 12px}
.wl-search-field{width:370px;height:36px;padding:0 8px;border-radius:10px;background:var(--c-wl-search-bg);display:flex;align-items:center;gap:6px;color:var(--c-wl-search-fg)}
.wl-search-icon{display:block;flex-shrink:0}
/* 外層 .stage 關閉了文字選取，輸入框需重新開啟才能在 iPad 上輸入 */
.wl-search-input{flex:1;min-width:0;height:22px;padding:0;border:0;outline:0;background:transparent;font-family:var(--font-family);font-size:var(--fs-wl-search);line-height:22px;letter-spacing:-.43px;color:var(--c-wl-text);-webkit-user-select:text;user-select:text}
.wl-search-input::placeholder{color:var(--c-wl-search-fg)}
/* 標題與搜尋固定，清單區可捲動 */
/* 下方圓角同面板：列有白底（左滑用），捲到底時才不會露出直角；面板本身不裁切，因為三角形畫在面板外 */
.wl-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:0 0 12px 12px}
.wl-item{padding:8px 20px 11px;display:flex;align-items:center;gap:12px}
/* 左滑：外框固定，內容（.wl-item）往左移露出右側操作按鈕；上下滑交給清單捲動 */
.wl-row{position:relative;overflow:hidden;border-bottom:1px solid var(--c-wl-divider);touch-action:pan-y}
.wl-row:last-child{border-bottom:0}
.wl-row .wl-item{position:relative;z-index:1;background:var(--c-wl-bg);transition:transform var(--dur-wl-swipe) ease-out}
.wl-row.is-open .wl-item{transform:translateX(-288px)}
.wl-actions{position:absolute;top:0;right:0;bottom:0;display:flex}
.wl-action{display:flex;align-items:center;justify-content:center;width:var(--w-wl-swipe-action);color:var(--c-wl-swipe-fg);cursor:pointer}
.wl-action svg{display:block;width:var(--sz-wl-swipe-icon);height:var(--sz-wl-swipe-icon)}
.wl-action-edit{background:var(--c-wl-swipe-edit)}
.wl-action-qr{background:var(--c-wl-swipe-qr)}
.wl-action-cancel{background:var(--c-wl-swipe-cancel)}
/* 取消後：淡出並收合，下方列往上補 */
.wl-row.is-removing{opacity:0;transition:height var(--dur-wl-remove) ease-in-out,opacity var(--dur-wl-remove) ease-in-out}

/* iOS 原生樣式 Alert（取消候位） */
.ios-alert-scrim{position:absolute;inset:0;background:var(--c-scrim);display:flex;align-items:center;justify-content:center;z-index:46;animation:wl-fade-in var(--dur-base) ease-out both}
.ios-alert{width:270px;border-radius:14px;background:var(--c-ios-alert-bg);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);overflow:hidden;text-align:center;color:#000}
.ios-alert-body{padding:19px 16px;display:flex;flex-direction:column;gap:2px}
.ios-alert-title{font-size:var(--fs-ios-alert-title);line-height:22px;font-weight:600}
.ios-alert-msg{font-size:var(--fs-ios-alert-msg);line-height:16px;white-space:pre-line}
.ios-alert-actions{display:flex;border-top:.5px solid var(--c-ios-alert-line)}
.ios-alert-btn{flex:1;height:44px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-ios-alert-title);color:var(--c-ios-alert-action);cursor:pointer}
.ios-alert-btn+.ios-alert-btn{border-left:.5px solid var(--c-ios-alert-line)}
.ios-alert-btn.is-destructive{color:var(--c-ios-alert-destructive);font-weight:600}
.wl-num{width:44px;height:44px;flex-shrink:0;border-radius:100px;background:var(--c-wl-num-bg);color:var(--c-wl-num-fg);font-size:var(--fs-wl-body);line-height:20px;font-weight:500;display:flex;align-items:center;justify-content:center}
.wl-info{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:500;color:var(--c-wl-text)}
.wl-name-row{display:flex;align-items:center;gap:12px;font-size:var(--fs-wl-name);line-height:24px;white-space:nowrap}
.wl-name{display:flex;align-items:center;gap:4px}
.wl-pending{padding:4px 8px;border-radius:100px;background:var(--c-pending-bg);border:1.5px solid var(--c-pending-fg);color:var(--c-pending-fg);font-size:var(--fs-table-pending);line-height:16px}
.wl-phone{font-size:var(--fs-wl-body);line-height:20px}
.wl-meta{display:flex;gap:8px;font-size:var(--fs-wl-meta);line-height:16px;color:var(--c-wl-text-variant);white-space:nowrap}
.wl-hl{color:var(--c-wl-highlight)}
.wl-empty{padding:24px 20px;text-align:center;font-size:var(--fs-wl-body);color:var(--c-wl-text-variant)}

.tc-total{height:48px;padding:8px 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-wla-body);line-height:24px;font-weight:500;color:#000}
.tc-total-val{font-weight:400;line-height:20px;color:var(--c-tc-value)}
.tc-subtitle-wide{padding-left:20px}
.tc-tags{padding:12px 20px}
.tc-note-wrap{height:120px;padding:8px 20px}
.tc-note-wrap .wla-note{padding:14px 16px;font-weight:500;line-height:24px}
.tc-note-wrap .wla-note::placeholder{color:var(--c-tc-value);opacity:var(--op-tc-note-placeholder)}
.tc-footer{flex-shrink:0;padding:16px 20px;display:flex;gap:16px;background:var(--c-white);border-top:1px solid var(--c-op-line)}
.tc-footer .nav-btn{flex:1;height:38px}
/* 佔桌＋待確認訂單：內容改為訂單卡（上方距頂部列 12px） */
.tc-body.is-order{padding-top:56px}
.tc-nav-spacer{width:1px}
.tc-order{background:var(--c-white)}
.tc-order-head{padding:16px 32px;display:flex;align-items:center;justify-content:space-between;background:var(--c-tc-order-head-bg);color:var(--c-tc-order-head-fg);font-size:var(--fs-tc-order-title);line-height:24px;font-weight:600;white-space:nowrap}
.tc-order-page{width:62px;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.tc-order-page img{display:block;flex-shrink:0}
.tc-order-sub{padding:8px 16px;background:var(--c-wla-bg);font-size:var(--fs-wla-body);line-height:24px;font-weight:500;color:#000}
.tc-order-item{padding:8px 16px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--c-op-line);line-height:24px}
.tc-order-item:last-child{border-bottom:0}
.tc-order-name{display:flex;justify-content:space-between;font-size:var(--fs-tc-order-title);font-weight:600;color:var(--c-tc-order-pending)}
.tc-order-spec{font-size:var(--fs-wla-body);font-weight:500;color:#000}
/* 一般訂單卡：藍色標題列、顧客列、淡黃底黑字品項（最後一項也有分隔線） */
.tc-order.is-paid .tc-order-head{padding:12px 16px;background:var(--c-tc-order-paid-bg);color:var(--c-tc-order-paid-fg)}
.tc-order.is-paid .tc-order-item{background:var(--c-tc-order-item-bg)}
.tc-order.is-paid .tc-order-item:last-child{border-bottom:1px solid var(--c-op-line)}
.tc-order.is-paid .tc-order-name{color:#000}
.tc-order-cust{padding:8px 16px;display:flex;flex-direction:column;gap:4px;background:var(--c-tc-order-cust-bg);font-size:var(--fs-tc-order-title);line-height:24px;font-weight:600;color:#000;white-space:nowrap}
.tc-order-cust-row{display:flex;gap:4px}
/* 待離桌：無訂單，中間為圖片佔位、說明與「清桌」（方塊上緣距桌卡頂 184px） */
.tc-body.is-done{padding-top:184px;align-items:center;gap:0}
.tc-done-img{width:135px;height:135px;flex-shrink:0;border-radius:6px;background:var(--c-tc-done-placeholder)}
.tc-done-text{margin-top:16px;font-size:var(--fs-tc-done);line-height:16px;color:var(--c-tc-value)}
/* 桌卡內的會員卡片切換與展開：區塊間距為 12px，收合時以 -12px 抵銷 */
.tc-body .wla-swap.is-collapsed{margin-bottom:-12px}
.tc-body .wla-swap-inner{gap:12px}
.tc-panel .wla-toast{bottom:92px}
/* 空桌桌卡（一般掃碼點餐）：高度依內容，於提示列下方區域垂直置中（top、max-height 由 JS 設定） */
.tc-panel.is-open{height:auto;transform:translateY(-50%)}
.tc-panel.is-open .tc-body{flex:1 1 auto;padding:64px 0 0}
.tc-panel.is-open .tc-body.is-adv{padding-bottom:20px}
.tc-panel.is-open .tc-body.is-adv,.tc-panel.is-open .tc-nav-adv,.tc-panel.is-adv .tc-body.is-main,.tc-panel.is-adv .tc-nav-main,.tc-panel.is-adv .tc-footer{display:none}
.tc-panel.is-adv .tc-body.is-adv,.tc-panel.is-adv .tc-nav-adv{display:flex}
.tc-nav-main,.tc-nav-adv{flex:1;display:flex;align-items:center;justify-content:space-between}
.tc-nav-plain-title{position:absolute;left:50%;transform:translateX(-50%);font-size:var(--fs-wla-nav-title);line-height:22px;font-weight:600;letter-spacing:-.43px;color:#000;white-space:nowrap}
.tc-nav-back{display:flex;align-items:center;gap:6px;margin-left:-16px}
.tc-rows{padding:12px 16px}
.tc-row{height:48px;padding:8px 12px 8px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--c-op-line);font-size:var(--fs-wla-body);line-height:24px;font-weight:500;color:#000;white-space:nowrap}
.tc-row:last-child{border-bottom:0}
.tc-row[data-act]{cursor:pointer}
.tc-row-val{display:flex;align-items:center;gap:4px;font-weight:400;line-height:20px;color:var(--c-tc-value)}
.tc-expand-btn{align-self:center;padding:4px 8px 4px 12px;display:flex;align-items:center;font-size:var(--fs-tc-expand);line-height:20px;font-weight:500;color:var(--c-op-primary);cursor:pointer}
.tc-expand-btn img{display:block;transition:transform var(--dur-wla-swap) ease-in-out}
.tc-expand-btn.is-open img{transform:rotate(180deg)}
.tc-footer.is-open{padding:20px 16px;background:transparent;border-top:0}
.tc-adv-group{background:var(--c-white)}
.tc-adv-group .tc-row{padding-left:16px}
.tc-toggle{position:relative;width:51px;height:31px;flex-shrink:0;border-radius:100px;background:var(--c-tc-toggle-off);cursor:pointer;transition:background var(--dur-base)}
.tc-toggle::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:100px;background:var(--c-tc-toggle-knob);box-shadow:var(--sh-tc-toggle-knob);transition:transform var(--dur-base)}
.tc-toggle.is-on{background:var(--c-tc-toggle-on)}
.tc-toggle.is-on::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){.tc-toggle,.tc-toggle::after,.tc-expand-btn img{transition:none}}
.tc-done-btn{margin-top:8px;padding:4px 10px;font-size:var(--fs-tc-done);line-height:20px;font-weight:500;color:var(--c-op-primary);cursor:pointer}
</style>
</head>

  // 會員資料關閉時儲存：沒修改直接關閉；只驗證手機；通過後更新會員主檔，並同步所有樓層的桌位、候位清單與開啟中的表單（同一位會員 id）
  saveMemberInfo() {

  // 搜尋會員：所有欄位比對姓名、電話、會員編號；電話號碼、會員編號只比對該欄（數字部分）
  memberResults() {

  editWaitlist(no) {

  // 編輯：原地更新（流水號、排隊位置、已等分鐘、待確認訂單不變）
  submitWaitlist() {

    const list = this.state.wlData, first = $('wlaName').value.trim(), people = a.adults + a.kids + a.infants;

    };

  cardTable() { return this.tables().find(t => t.id === this.state.card); }
  // 特殊需求標籤（R57）：wla 讀寫新增／編輯候位暫存，tc 讀寫桌卡表單（佔桌記在該桌、空桌記在開桌暫存）
  needsOf(f) { return f === 'wla' ? this.state.wlAdd.needs : this.cardForm().needs; }
  setNeeds(f, needs) { if (f === 'wla') this.setState({ wlAdd: { ...this.state.wlAdd, needs } }); else this.setCardForm({ needs }); }
  needsHTML(f, needs) {
    return (needs.length < TAGS.length ? `<span class="wla-tag wla-tag-add" data-act="needsPool" data-f="${f}">${ICON_TAG_ADD}加入標籤</span>` : '') +
      needs.map(g => `<span class="wla-tag">${g}<span class="wla-tag-x" data-act="needsRemove" data-f="${f}" data-t="${g}">${ICON_TAG_REMOVE}</span></span>`).join('');

  // 桌卡表單資料：佔桌讀寫該桌的 cust（大人＝入座人數－小孩－嬰兒）；空桌讀寫開桌暫存
  cardForm() {
    const t = this.cardTable(), o = this.state.cardOpen;
    if (o) return { title: o.title, member: o.member, adults: o.adults, kids: o.kids, infants: o.infants, needs: o.needs };
    const c = t.cust;
    return { title: c.title, member: c.member, adults: (t.guests ?? 0) - c.kids - c.infants, kids: c.kids, infants: c.infants, needs: c.needs || [] };
  }
  setCardForm(patch) {
    if (this.state.cardOpen) { this.setState({ cardOpen: { ...this.state.cardOpen, ...patch } }); return; }
    const id = this.state.card;
    this.setState({ data: this.update(l => Object.assign(l.find(x => x.id === id).cust, patch)) });
  }
  // 桌卡來客數：佔桌大人最少 1（必填）、開桌彈窗大人可減到 0（送出時才檢核）；小孩與嬰兒最少 0；
  // 佔桌的入座人數＝三者合計，桌位上的人數即時更新
  stepCardGuest(k, d) {
    const f = this.cardForm(), o = this.state.cardOpen;
    if (k === 'adults' ? f.adults + d < (o ? 0 : 1) : f[k] + d < 0) return;
    // 大人加到 1 以上即清除「請設定人數」

  openTableFromCard(qr) {
    const t = this.cardTable(), o = this.state.cardOpen;
    if (o.seatNo) return this.seatTable(t, qr);
    // 必填的大人為 0：不送出，大人列標示錯誤並捲到該欄（來客數在最上方）
    if (o.adults === 0) {

      if (body) body.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });

  // 清桌（確認清桌）：該桌變空桌，訂單、顧客資料、待確認標記一併清除（標籤留在桌上），關閉 Alert 與桌卡
  clearTable() {

  // 有待確認訂單時移轉到桌位（加上待確認標記）；從候位清單移除並離開選桌模式
  seatTable(t, qr) {
    if (t.status !== 'empty') return this.seatJoin(t, qr);
    const w = this.seatEntry(), { first, title } = w.first !== undefined ? w : splitName(w.name);
    const cust = { ...TC_CUST(w.member ? w.member.phone : w.phone), name: w.member ? '' : first, title, kids: w.kids || 0, infants: w.infants || 0, note: w.note || '', member: w.member || null, needs: w.needs || [], fromWl: true };

      data: this.update(l => { const x = l.find(y => y.id === t.id);

  // 候位開桌到有人桌「本桌會員」：候位與該桌都是會員（且不同人）時才出現；該桌目前會員在前（預設），候位會員為切換對象；前綴標示「原本桌會員」／「新移入會員」
  seatChoices(t, w) {
    const tm = t.cust && t.cust.member, wm = w.member;
    if (!tm || !wm || tm.name === wm.name) return [];
    return [{ name: tm.name, phone: tm.phone, from: '原本桌會員', wl: false }, { name: wm.name, phone: wm.phone, from: '新移入會員', wl: true }];
  }

  // 任一邊有待確認訂單即保留待確認標記；候位清單移除該筆並離開選桌模式

        if (pick && pick.wl) x.cust = { ...x.cust, member: w.member };
      }) });

  }
  // 量測桌位圖位置與縮放；拖曳／平移只在按下時量一次，避免每次移動都強制重新排版
  measure() { return this.rect = this.floorRef.current.getBoundingClientRect(); }
  // 觸點的可視範圍座標
  view(e) {
    const r = this.rect;
    const k = W / r.width;
    return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k };
  }
  // 觸點的畫布座標（加上平移量）
  local(e) {
    const v = this.view(e), { pan } = this.state;
    return { x: v.x + pan.x, y: v.y + pan.y };
  }
  setPan(x, y, extra) {
    this.setState({ ...extra, pan: { x: Math.max(0, Math.min(CW - W, x)), y: Math.max(0, Math.min(CH - this.state.viewH, y)) } });
  }
  // R63 候位開桌：可視範圍內沒有完整可見的空桌時，以最短距離捲到最近的空桌（只捲到剛好露出、離邊 24px）；整層無空桌則跳 Toast
  seekEmpty() {
    if (!this.state.seat) return;
    const NO_EMPTY = '本樓層沒有空桌', NO_FIT = '本樓層沒有符合條件的空桌';
    const all = this.tables().filter(t => t.status === 'empty');
    if (!all.length) return this.showToast(NO_EMPTY);
    // 有符合條件的空桌只找它們；都不符合時退回找最近的任一空桌並提示
    const fits = all.filter(t => this.seatFits(t)), empties = fits.length ? fits : all;
    if (!fits.length) this.showToast(NO_FIT);
    else if (this.state.toast && [NO_EMPTY, NO_FIT].includes(this.state.toast.text)) { clearTimeout(this.tt); this.setState({ toast: null }); } // 已有符合的空桌時收起
    const pan = this.state.pan, vh = this.state.viewH + TABS_H; // 選桌模式頁籤列隱藏
    const HINT = 52, M = 24, MM = { w: 190 + 16, h: 100 + 16 }; // 提示列、邊距、小地圖（含距邊 16px）
    const maxX = CW - W, maxY = CH - this.state.viewH;
    const box = t => ({ l: t.x - t.size / 2, t: t.y - t.size / 2, r: t.x + t.size / 2, b: t.y + t.size / 2 });

    const nav = (title, cancel) => `<div class="mv-nav">${cancel ? `<div class="wla-nav-btn" data-act="mvCancel">取消</div>` : ''}<div class="wla-nav-title">${title}</div></div>`;
