    // 本桌會員（可切換）：沒有選項時不顯示
    const memberPick = members => memberSwap(members, m.member, 'mvMember');
    let inner = '';
    if (m.step === 'pick') {
      const blocked = !m.sel.length;
      inner = nav('選擇要換桌的訂單') +
        `<div class="mv-body"><div>` + [...(from.pending ? [{ no: 'p', pending: true, items: PENDING_ORDER.map(o => o.name).join(', '), price: PENDING_ORDER.reduce((n, o) => n + o.price, 0) }] : []), ...from.list].map(o =>
          `<div class="mv-order${m.sel.includes(o.no) ? '' : ' is-off'}" data-act="mvToggle" data-no="${o.no}"><div class="mv-order-inner">` +
            `<span class="mv-check">${m.sel.includes(o.no) ? ICON_CHECK : ''}</span>` +
            `<div class="mv-order-main">` +
              // 待確認訂單：標題「待確認訂單」（同會員姓名樣式，取消勾選變黑）
              `<span class="mv-order-name">${o.pending ? '<span>待確認訂單</span>' : `<span>#${o.last3}</span>${o.member ? `<span class="mv-order-emoji">👤</span><span>${o.name}</span>` : ''}`}</span>` +
              `<span class="mv-order-meta mv-order-items">${o.items}</span>` +
            `</div>` +
            `<span class="mv-order-meta mv-order-price">${money(o.price)}</span>` +
          `</div></div>`).join('') +
        `</div></div>` +
        `<div class="mv-footer">` +
          // 部分勾選（不論目標桌況）：提示移桌後如需掃碼點餐要新建 QR Code
          (m.sel.length && m.sel.length < this.units(from) ? `<div class="tc-seat-notice mv-notice">${ICON_INFO}移桌後如需掃碼點餐，請至桌位詳情頁新建 QR Code</div>` : '') +
          `<div class="mv-btns"><div class="nav-btn nav-btn-secondary" data-act="mvCancel">取消</div><div class="nav-btn nav-btn-primary${blocked ? ' is-disabled' : ''}" data-act="mvPick">換桌</div></div>` +
        `</div>`;
    } else if (m.step === 'cap') {
      const sum = (from.guests ?? 1) + (to.guests ?? 0);
      inner = nav('加入有人桌', true) +
        `<div class="mv-body"><div class="wla-card tc-rows">${row('來源桌', tableDesc(from))}${row('移入人數', `成人 ${from.guests ?? 1}人`)}${row('目標桌人數', (to.guests ?? '-') + '人')}</div>` +
          memberPick(this.capChoices(from, to)) +
          (sum > to.cap ? `<div class="mv-warn">加入後 ${sum} 人，超過座位數</div>` : '') + `</div>` +
        submit('確認加入', 'mvCapConfirm');
    } else {
      const picked = from.list.filter(o => m.sel.includes(o.no));
      const members = this.moveChoices(picked, to, from), total = m.adults + m.kids + m.infants;
      inner = nav('加入有人桌', true) +
        `<div class="mv-body"><div class="wla-card tc-rows">${row('來源桌', tableDesc(from))}${row('目標桌人數', (to.guests ?? '-') + '人')}</div>` +
          memberPick(members) +
          `<div><div class="wla-subtitle">移入人數</div><div class="wla-card wla-guests">` + WLA_GUESTS.map(g =>
            `<div class="wla-guest"><div class="wla-guest-inner">` +
              `<div class="wla-guest-label">${g.label}${g.required ? `<span class="wla-required">必填</span>` : ''}</div>` +
              `<div class="wla-guest-count"><span>${m[g.k]}</span><div class="wla-stepper">` +
                `<div class="wla-step" data-act="mvStep" data-k="${g.k}" data-d="-1">${ICON_MINUS}</div>` +
                `<div class="wla-step" data-act="mvStep" data-k="${g.k}" data-d="1">${ICON_PLUS}</div>` +
              `</div></div>` +
            `</div></div>`).join('') +
            `<div class="tc-total"><span>合計</span><span class="tc-total-val">${total}人</span></div>` +
          `</div></div>` +
          ((to.guests ?? 0) + total > to.cap ? `<div class="mv-warn">加入後 ${(to.guests ?? 0) + total} 人，超過座位數</div>` : '') +
        `</div>` +
        submit('確認加入', 'mvPartialConfirm');
    }
    // 狀態列以下的區域置中，上下至少留 20px
    const contentH = this.state.screenH - this.state.safeTopPx;
    // 外框（遮罩、面板）只在開啟時建立，避免每次勾選重播淡入動畫；同一步驟內保留清單捲動位置
    html($('moveDialog'), `<div class="mv-scrim" id="mvScrim"></div><div class="mv-panel" id="mvPanel"></div>`);
    const scrim = $('mvScrim'), panel = $('mvPanel');
    scrim.dataset.act = 'mvCancel'; // 點遮罩同「取消」（各步驟皆同）
    setStyle(panel, { top: `${this.state.safeTopPx + contentH / 2}px`, maxHeight: `${contentH - 40}px` });
    const body = panel.querySelector('.mv-body'), keep = body && panel._step === m.step ? body.scrollTop : 0;
    html(panel, inner);
    panel._step = m.step;
    if (keep) panel.querySelector('.mv-body').scrollTop = keep;
  }

  renderVals() {
    const { floor, drag, popover, filter, toast, pan, viewH, press, timerMode, tags, seatFilter, seat, swap } = this.state;
    const picking = !!(seat || swap); // 候位開桌或換桌的選桌模式
    const list = this.tables();
    const src = drag && list.find(t => t.id === drag.id);
    const overT = drag && drag.overId && list.find(t => t.id === drag.overId);

    const tables = list.map(t => {
      const s = ST[t.status], isEmpty = t.status === 'empty';
      const isSrc = drag && drag.id === t.id, isOver = drag && drag.overId === t.id;
      let bg = s.bg, border = 'var(--bd-table)', scale = 1, shadow = 'none', badge = null;
      // 桌況篩選不符 22%；標籤或座位數條件不符 30%（桌況也不符時取較淡的 22%）
      let opacity = filter && filter !== t.status ? 0.22 : !hasTags(t, tags) || !fitsSeat(t, seatFilter) ? 'var(--op-tag-dim)' : 1;
      if (popover === t.id && !drag) shadow = 'var(--sh-table-selected)';
      if (press && press.id === t.id && !drag) scale = 'var(--press-scale)';
      if (drag) {
        opacity = 1;
        if (isSrc) opacity = 0.3;
        if (isOver && isEmpty) shadow = 'var(--sh-table-drop-empty)';
        else if (isOver) { scale = 1.06; shadow = 'var(--sh-table-drop-merge)'; }
      }
      // 選桌模式（候位開桌、點擊換桌）：空桌加呼吸外框，有人的桌 30%（篩選淡化暫時解除）
      // 候位開桌：不符合條件的空桌（R63）也 30%、無呼吸外框
      const fit = !seat || !isEmpty || this.seatFits(t);
      if (picking) opacity = isEmpty && fit ? 1 : isEmpty ? 'var(--op-tag-dim)' : 0.3;
      if (isEmpty) shadow = shadow === 'none' ? 'var(--sh-table-empty)' : `${shadow}, var(--sh-table-empty)`;
      // 佔桌計時：非空桌才顯示；剩餘模式超過時限改顯示超時標籤
      const pad = n => String(n).padStart(2, '0'), left = TABLE_TIME_LIMIT - t.mins;
      const time = isEmpty || !timerMode ? null :
        timerMode === 'used' ? { text: `${pad(Math.floor(t.mins / 60))}:${pad(t.mins % 60)}` } :
        left >= 0 ? { text: `${left}分` } : { over: -left };
      return {
        name: t.name, isEmpty, badge, bg, border, color: s.color, opacity, scale, shadow,
        userIcon: ICON[s.userIcon], pending: t.pending, time,
        left: t.x - t.size / 2, top: t.y - t.size / 2, size: t.size,
        radius: t.shape === 'circle' ? '50%' : '8px',
        guestsText: isEmpty ? `${t.cap}` : `${t.guests ?? '-'}/${t.cap}`,
        seatTarget: picking && isEmpty && fit,
        onDown: e => this.down(t, e),
      };
    });

    // 有桌況篩選、勾標籤或選座位數時，右側改顯示本樓層同時符合所有條件的桌數
    const filtered = !!filter || tags.length > 0 || !!seatFilter;
    const total = filtered ? `本區 ${list.filter(t => (!filter || filter === t.status) && hasTags(t, tags) && fitsSeat(t, seatFilter)).length} 桌符合` : '全店 100 桌';

    const counts = {}; ORDER.forEach(k => counts[k] = list.filter(t => t.status === k).length);
    const chips = ORDER.map(k => ({
      label: ST[k].label, count: counts[k], dot: ST[k].dot,
      isEmpty: k === 'empty',
      bg: filter === k ? 'var(--c-chip-active-bg)' : 'var(--c-chip-bg)', outline: filter === k ? 'var(--bd-chip-active)' : 'none',
      onClick: () => this.setState({ filter: filter === k ? null : k }),
    }));

    let pop = null;
    const pt = popover && list.find(t => t.id === popover);
    if (pt) {
      const right = pt.x + pt.size / 2 + 14 + 240 < pan.x + W - 10;
      pop = {
        left: right ? pt.x + pt.size / 2 + 14 : pt.x - pt.size / 2 - 254,
        top: Math.max(pan.y + 10, Math.min(pan.y + viewH - 16 - 250, pt.y - 70)),
        name: pt.name, status: ST[pt.status].label, dot: ST[pt.status].dot,
        hasOrder: pt.status !== 'empty', isEmpty: pt.status === 'empty',
        orderNo: pt.orderNo, guestsText: `${pt.guests}/${pt.cap} 人`, mins: pt.mins, amount: money(pt.amount),
        capText: `${pt.cap} 人座 · 目前無訂單`,
        onOpen: () => {
          this.setState({ popover: null, data: this.update(l => Object.assign(l.find(x => x.id === pt.id), { status: 'seated', guests: Math.min(2, pt.cap), mins: 0, orderNo: '#A' + (1040 + pt.id * 7), cust: TC_CUST('') })) });
          this.showToast(`${pt.name}已開桌`);
        },
      };
    }

    // 小地圖藍框：可視範圍在畫布中的位置，對應到小地圖內距 3px 的區域
    const kx = (190 - 6) / CW, ky = (100 - 6) / CH;
    const mini = { x: 3 + pan.x * kx, y: 3 + pan.y * ky, w: W * kx, h: (drag || picking ? viewH + TABS_H : viewH) * ky };

    const tabs = ['設定', '預約', '桌位圖', '外帶/外送', '包裝台', '工作站', '新訂單'].map((l, i) => ({
      label: l, bg: i === 2 ? 'var(--c-tab-active-bg)' : 'transparent', color: i === 2 ? 'var(--c-primary)' : 'var(--c-text-secondary)', r: i % 2 ? '50%' : '4px',
    }));

    return {
      scale: this.state.scale, screenH: this.state.screenH, floorRef: this.floorRef, pan,
      floors: Object.keys(FLOORS).map(n => ({ name: n, bg: n === floor ? 'var(--c-floor-tab-active-bg)' : 'var(--c-floor-tab-bg)', color: n === floor ? 'var(--c-floor-tab-active-fg)' : 'var(--c-floor-tab-fg)', border: n === floor ? 'none' : '1px solid var(--c-floor-tab-border)', padding: n === floor ? '4px 12px' : '3px 11px', onClick: () => { this.stopAutoPan(); this.clearLand(); this.setState({ floor: n, popover: null, card: null, swap: null, pan: { x: 0, y: 0 } }); this.seekEmpty(); } })),
      chips, total, filtered, tables, tabs, mini, obstacles: FLOORS[floor].obstacles.map(o => ({ ...o, wm: o.wm || 'horizontal-tb' })),
      drag: !!drag,
      ghost: drag ? { x: drag.x - pan.x, y: drag.y - pan.y, name: src.name, guests: src.guests, hasOrder: this.movesOrders(src), orders: Math.max(1, this.units(src)) } : {},
      showTabs: !drag && !picking,
      dragHint: !drag ? '' : this.movesOrders(src)
        ? (!overT ? `拖曳${src.name}訂單至目標桌` : overT.status === 'empty' ? `放開移動訂單到${overT.name}` : `放開合併訂單到${overT.name}`)
        : (!overT ? `拖曳${src ? src.name : ''}至目標桌` : overT.status === 'empty' ? `放開移至${overT.name}` : `放開合併至${overT.name}`),
      popover: pop, toast,
      onFloorDown: () => popover && this.setState({ popover: null }),
      stop: e => e.stopPropagation(),
    };
  }

  // 將 renderVals() 的結果套用到 DOM（取代原模板的 {{ }} 綁定）
  render() {
    const v = this.vals = this.renderVals();

    $('device').style.transform = `scale(${v.scale})`;
    $('screen').style.height = v.screenH + 'px';
    $('screen').style.setProperty('--safe-top', this.state.safeTopPx + 'px');
    $('statusbarArea').style.height = this.state.safeTopPx + 'px';
    $('waitlistCount').textContent = this.state.wlData.length;
    $('screen').classList.toggle('is-seat-lock', !!this.state.seat);
    $('screen').classList.toggle('is-swap-lock', !!this.state.swap);
    $('canvas').style.transform = `translate3d(${-v.pan.x}px,${-v.pan.y}px,0)`;

    html($('floorTabs'), v.floors.map((f, i) =>
      `<div class="floor-tab" data-act="floor" data-i="${i}" style="background:${f.bg};color:${f.color};border:${f.border};padding:${f.padding}">${f.name}</div>`).join(''));

    html($('chips'), v.chips.map((c, i) =>
      `<div class="chip" data-act="chip" data-i="${i}" style="background:${c.bg};outline:${c.outline}">` +
        (c.isEmpty ? `<svg class="chip-dot-empty" width="10" height="10" viewBox="0 0 10 10" style="stroke-dasharray:${evenDash('--bd-chip-dot-empty-dash', 2 * Math.PI * 4)}"><circle cx="5" cy="5" r="4" pathLength="${2 * Math.PI * 4}"/></svg>` : `<div class="chip-dot" style="background:${c.dot}"></div>`) + `<span>${c.label}</span><span>(${c.count})</span>` +
      `</div>`).join(''));

    html($('obstacles'), v.obstacles.map(o =>
      `<div class="obstacle" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;border-radius:${o.r};writing-mode:${o.wm}">${o.label}</div>`).join(''));

    this.renderTables(v.tables);
    this.renderSettings();
    this.renderTagFilter(v.total);
    this.renderSeatFilter();
    html($('filterClear'), v.filtered ? '<div class="filter-clear" data-act="clearFilters">清除條件</div>' : '');

    const p = v.popover;
    html($('popover'), !p ? '' :
      `<div class="popover" data-stop style="left:${p.left - v.pan.x}px;top:${p.top - v.pan.y}px">` +
        `<div class="popover-head">` +
          `<div class="popover-title">${p.name}</div>` +
          `<div class="popover-status"><div class="popover-status-dot" style="background:${p.dot}"></div>${p.status}</div>` +
        `</div>` +
        (p.hasOrder ?
          `<div class="popover-grid">` +
            `<span>訂單</span><span class="popover-val">${p.orderNo}</span>` +
            `<span>人數</span><span class="popover-val">${p.guestsText}</span>` +
            `<span>用餐</span><span class="popover-val">${p.mins} 分鐘</span>` +
            `<span>金額</span><span class="popover-val popover-amount">${p.amount}</span>` +
          `</div>` +
          `<div class="popover-hint">長按並拖曳此桌，即可換桌或合併</div>` : '') +
        (p.isEmpty ?
          `<div class="popover-cap">${p.capText}</div>` +
          `<div class="popover-open" data-act="open">開桌</div>` : '') +
      `</div>`);

    setStyle($('miniViewport'), { left: v.mini.x + 'px', top: v.mini.y + 'px', width: v.mini.w + 'px', height: v.mini.h + 'px' });

    const g = v.ghost;
    // 雙人圖示（依 Figma：前方人形主色、後方人形深色，中間以白邊分隔）
    const people =
      `<svg width="28" height="23" viewBox="0 0 28 23">` +
        `<g style="fill:var(--c-ghost-icon-back)"><circle cx="19" cy="5.5" r="4.5"/><path d="M10 22c0-5.5 4-9.5 9-9.5s9 4 9 9.5z"/></g>` +
        `<g style="fill:var(--c-table-accent);stroke:var(--c-white);stroke-width:1.5"><circle cx="10" cy="5.5" r="5"/><path d="M0.75 22.25c0-6 4.1-10.25 9.25-10.25s9.25 4.25 9.25 10.25z"/></g>` +
      `</svg>`;
    // 訂單板圖示（依 Figma：白底、淺藍上緣、深色夾子、三列藍點＋淺藍線）
    const row = y => `<rect x="3" y="${y}" width="3" height="3" style="fill:var(--c-ghost-order-bullet)"/><rect x="7" y="${y - 0.5}" width="13" height="4" style="fill:var(--c-ghost-order-line)"/>`;
    const orderIcon =
      `<svg class="ghost-order-icon" width="23" height="31" viewBox="0 0 23 31">` +
        `<rect x="0" y="3" width="23" height="28" style="fill:var(--c-white)"/>` +
        `<rect x="0" y="3" width="23" height="7" style="fill:var(--c-ghost-order-head)"/>` +
        `<rect x="6" y="2" width="11" height="4" style="fill:var(--c-ghost-order-clip-base)"/>` +
        `<rect x="8" y="0" width="7" height="4" style="fill:var(--c-ghost-order-clip)"/>` +
        row(14) + row(20) + row(25) +
      `</svg>`;
    // 拖曳卡：搬訂單時顯示訂單卡（訂單 xN），佔桌或待離桌且無待確認時顯示人數卡（人數 xN）；內容在一次拖曳中不變，只在拖曳開始時建立；之後只更新 transform
    html($('ghost'), !v.drag ? '' :
      `<div class="ghost">` +
        `<div class="ghost-card">` +
          `<div class="ghost-name">${g.name}</div>` +
          `<div class="ghost-icon">${g.hasOrder ? orderIcon : people}</div>` +
          `<div class="ghost-guests"><span>${g.hasOrder ? '訂單' : '人數'}</span><span>x${g.hasOrder ? g.orders : g.guests}</span></div>` +
        `</div>` +
      `</div>`);
    if (v.drag) {
      // 卡片在觸點正上方；觸點太靠上時往下移，卡片頂端不超過 --ghost-top-min（不被提示列蓋住）
      const css = getComputedStyle(document.documentElement);
      const gap = parseFloat(css.getPropertyValue('--ghost-gap')), topMin = parseFloat(css.getPropertyValue('--ghost-top-min'));
      const y = Math.max(g.y, topMin + $('ghost').firstChild.firstChild.offsetHeight + gap);
      $('ghost').firstChild.style.transform = `translate3d(${g.x}px,${y}px,0) rotate(-4deg)`;
    }
    html($('dragHint'), !v.drag ? '' : `<div class="drag-hint">${v.dragHint}</div>`);

    html($('toast'), !v.toast ? '' :
      `<div class="toast"><span>${v.toast.text}</span>` +
      `</div>`);

    html($('tabs'), !v.showTabs ? '' :
      `<div class="tabbar">` + v.tabs.map(tb =>
        `<div class="tab" style="background:${tb.bg};color:${tb.color}">` +
          `<div class="tab-icon" style="border-color:${tb.color};border-radius:${tb.r}"></div>` +
          `<div class="tab-label">${tb.label}</div>` +
        `</div>`).join('') +
      `</div>`);

    this.renderWaitlist();
    this.renderWaitlistAdd();
    this.renderMemberSearch();
    this.renderMemberInfo();
    this.renderSeatHint();
    this.renderTableCard();
    this.renderMoveDialog();
    this.renderLeaveAlert();
    this.renderNeedsPool();
  }

  // 特殊需求標籤池（R57）：開在「加入標籤」下方，只列尚未加入的標籤；表單已關閉或標籤都加完時一併關閉
  renderNeedsPool() {
    const f = this.state.needsPool, btn = f && document.querySelector(`[data-act="needsPool"][data-f="${f}"]`);
    if (f && !btn) this.state.needsPool = null;
    const left = btn ? TAGS.filter(g => !this.needsOf(f).includes(g)) : [];
    html($('needsPool'), !btn ? '' :
      `<div class="needs-pool" id="needsPoolMenu"><div class="settings-arrow"></div><div class="settings-card">` +
        `<div class="settings-head">標籤</div><div class="settings-gap"></div>` +
        `<div class="tag-list">${left.map(g => `<div class="tag-chip" data-act="needsAdd" data-t="${g}">${g}</div>`).join('')}</div>` +
      `</div></div>`);
    if (!btn) return;
    // 換算成畫面座標（畫面依視窗縮放）；三角形尖端（選單左緣 +24px）對準按鈕中央，下方放不下就改開在按鈕上方
    const menu = $('needsPoolMenu'), k = this.vals.scale, sr = $('screen').getBoundingClientRect(), br = btn.getBoundingClientRect();
    const bx = (br.left - sr.left) / k, top = (br.top - sr.top) / k, bottom = (br.bottom - sr.top) / k, h = menu.offsetHeight;
    const up = bottom + 6 + h > this.state.screenH - 8;
    menu.classList.toggle('is-up', up);
    setStyle(menu, { left: bx + br.width / k / 2 - 24 + 'px', top: (up ? top - 6 - h : bottom + 6) + 'px' });
  }

  // 訂單卡：待確認（橘色標題列、紅字品項）或一般訂單（藍色標題列、顧客列、淡黃底品項）；「3/3 ↻」「已付清」依 Figma 靜態顯示
  orderCard(t, pending) {
    const items = pending ? PENDING_ORDER : PAID_ORDER.items, total = money(items.reduce((n, o) => n + o.price, 0));
    return `<div class="tc-order${pending ? '' : ' is-paid'}">` +
      `<div class="tc-order-head"><span>${t.name}</span><span>${pending ? total : PAID_ORDER.status}</span>` +
        `<span class="tc-order-page">3/3<img src="${pending ? ICON_REFRESH : ICON_REFRESH_SOLID}" width="24" height="24" alt=""></span></div>` +
      (pending ? '' : `<div class="tc-order-cust"><div class="tc-order-cust-row"><span>👤</span><span>${PAID_ORDER.name}</span><span>${PAID_ORDER.phone}</span></div><div>${PAID_ORDER.note}</div></div>`) +
      `<div class="tc-order-sub">全部: 共 ${items.length} 項 (${total})</div>` +
      items.map((o, i) =>
        `<div class="tc-order-item"><div class="tc-order-name"><span>${i + 1}. ${o.name}</span><span>${money(o.price)}</span></div><div class="tc-order-spec">${o.spec}</div></div>`).join('') +
    `</div>`;
  }

  // 桌卡來客數（佔桌、空桌共用）：大人／小孩／嬰兒、合計
  cardGuestsHTML() {
    return `<div><div class="wla-subtitle">來客數</div><div class="wla-card wla-guests"><div id="tcGuests"></div>` +
        `<div class="tc-total"><span>合計</span><span class="tc-total-val" id="tcTotal"></span></div>` +
      `</div></div>`;
  }

  // 桌卡表單（佔桌、空桌共用）：會員卡片／手填欄位＋選擇會員、來客數（只有佔桌，排在最前面；空桌的來客數在桌卡最上方）、桌位備註；
  // 特殊需求只有從候位開桌的佔桌才有（R29、R57；空桌桌卡、一般開桌的佔桌不顯示）
  cardFormHTML(isOpen) {
    const startM = !isOpen && this.cardStartMember, t = !isOpen && this.cardTable(), needs = t && t.cust && t.cust.fromWl;
    return (isOpen ? '' : this.cardGuestsHTML()) +
      `<div class="wla-swap${startM ? '' : ' is-collapsed'}" id="tcMemberSwap"><div class="wla-swap-inner"><div class="wla-card wla-member" id="tcMemberCard"></div></div></div>` +
      `<div class="wla-swap${startM ? ' is-collapsed' : ''}" id="tcManualSwap"><div class="wla-swap-inner">` +
        `<div class="wla-card wla-contact">` +
          `<div class="wla-name-row">` +
            `<label class="wla-field wla-field-name"><span class="wla-field-inner"><span class="wla-field-label">姓名</span><input class="wla-input" id="tcName" type="text" placeholder="請輸入姓名"></span></label>` +
            `<div class="wla-titles" id="tcTitles"></div>` +
          `</div>` +
          `<label class="wla-field"><span class="wla-field-inner"><span class="wla-field-label">電話</span><input class="wla-input" id="tcPhone" type="text" inputmode="tel" placeholder="請輸入電話號碼"></span></label>` +
        `</div>` +
        `<div class="wla-card wla-link" data-act="tcMember"><span>選擇會員</span>${ICON_CHEVRON}</div>` +
      `</div></div>` +
      (needs ? `<div><div class="wla-subtitle tc-subtitle-wide">特殊需求設定</div><div class="wla-card tc-tags" id="tcNeeds"></div></div>` : '') +
      `<div><div class="wla-subtitle tc-subtitle-wide">桌位備註</div><div class="wla-card tc-note-wrap"><textarea class="wla-note" id="tcNote" placeholder="特殊需求、過敏、其他注意事項..."></textarea></div></div>`;
  }

  // 選桌模式的提示列（篩選列下方）：候位開桌、點擊換桌；開桌視窗、選訂單視窗開啟時被遮罩蓋住
  renderSeatHint() {
    const w = this.seatEntry(), sw = this.state.swap && this.tables().find(t => t.id === this.state.swap.from);
    const hint = (text, act) => `<div class="tc-hint seat-hint" style="top:${this.state.safeTopPx + CHROME_H}px"><span>${text}</span><div class="tc-hint-btn" data-act="${act}">取消</div></div>`;
    html($('seatHint'), w ? hint(`選擇桌位給 ${w.name || w.no}（${w.people}人）`, 'seatCancel') : sw ? hint(`選擇目標桌（${sw.name}換桌中）`, 'swapCancel') : '');
  }

  // 空桌桌卡（一般掃碼點餐）：主畫面（收合／展開顧客資料）與進階設定兩頁都先建立，以 class 切換
  // 候位開桌（w 為候位資料）：頂部列只有標題（點遮罩關閉）；內容為候位、來客數、桌位、掃碼點餐，不顯示顧客資料；
  // 有待確認訂單時按鈕上方提示移轉
  openCardHTML(t, w) {
    const row = (label, val, act) => `<div class="tc-row"${act ? ` data-act="${act}"` : ''}><span>${label}</span><span class="tc-row-val">${val}</span></div>`;
    const advRow = r => r.k ? `<div class="tc-row"><span>${r.label}</span><div class="tc-toggle" id="tcToggle-${r.k}" data-act="tcToggle" data-k="${r.k}"></div></div>`
      : row(r.label, r.val + (r.link ? ICON_CHEVRON : ''));
    const guestText = w && [['成人', w.adults ?? w.people], ['小孩', w.kids], ['嬰兒', w.infants]].filter(([, n]) => n).map(([k, n]) => `${k} ${n}人`).join('、');
    return `<div class="tc-nav">` +
        `<div class="tc-nav-main">${w ? '' : `<div class="tc-nav-btn" data-act="tcClose">取消</div>`}<div class="tc-nav-plain-title">開桌 - ${t.name}</div></div>` +
        `<div class="tc-nav-adv"><div class="tc-nav-btn tc-nav-back" data-act="tcAdvBack">${ICON_BACK}返回</div><div class="tc-nav-plain-title">進階設定</div></div>` +
      `</div>` +
      (w ? `<div class="tc-body is-main">` +
        `<div class="wla-card tc-rows">${row('候位', `${w.no} ${w.name}`.trim())}${row('來客數', guestText)}${row('桌位', `${t.shape === 'circle' ? '圓桌' : '方桌'}, ${t.cap}人桌`)}</div>` +
        `<div class="slot" id="seatPick"></div>` +
        `<div><div class="wla-subtitle">掃碼點餐</div><div class="wla-card tc-rows">${row('連結有效時間', '無限制')}${row('進階設定', ICON_CHEVRON, 'tcAdv')}</div></div>` +
        (w.pendingCount ? `<div class="tc-seat-notice">${ICON_INFO}待確認訂單將移轉至桌位</div>` : '') +
      `</div>` :
      `<div class="tc-body is-main">` +
        this.cardGuestsHTML() +
        `<div class="wla-card tc-rows">${row('連結有效時間', '無限制')}${row('進階設定', ICON_CHEVRON, 'tcAdv')}</div>` +
        `<div class="wla-swap${TC_GUEST_REQUIRED ? '' : ' is-collapsed'}" id="tcExpand"><div class="wla-swap-inner">${this.cardFormHTML(true)}</div></div>` +
        (TC_GUEST_REQUIRED ? '' : `<div class="tc-expand-btn" id="tcExpandBtn" data-act="tcExpand"><span id="tcExpandText"></span><img src="${ICON_ARROW_DOWN}" width="20" height="20" alt=""></div>`) +
      `</div>`) +
      `<div class="tc-body is-adv">` +
        TC_OPEN_TOGGLES.map(g => `<div class="tc-adv-group">${g.map(advRow).join('')}</div>`).join('') +
        `<div><div class="wla-subtitle tc-subtitle-wide">服務費及折扣</div><div class="tc-adv-group">${TC_OPEN_FEES.map(l => row(l, '請輸入')).join('')}</div></div>` +
        `<div><div class="wla-subtitle">備註</div><div class="wla-card wla-note-wrap"><textarea class="wla-note" placeholder="特殊需求、過敏、其他注意事項..."></textarea></div></div>` +
      `</div>` +
      `<div class="tc-footer is-open"><div class="nav-btn nav-btn-secondary" data-act="tcOpenTable" data-qr="0">開桌</div><div class="nav-btn nav-btn-primary" data-act="tcOpenTable" data-qr="1">掃碼開桌</div></div>`;
  }

  // 桌卡：外框（含輸入框）只在開啟時建立，保留輸入內容；稱謂、來客數、會員卡片等另外更新
  // 內容依桌況：空桌 → 開桌（一般掃碼點餐）；有待確認標記 → 待確認訂單卡；佔桌 → 表單；出餐中、已出餐 → 一般訂單卡；待離桌 → 結清畫面
  // 頂部列「清桌」只在表單、待離桌（含有待確認訂單）顯示（依 Figma）；表單資料一律記在桌上
  renderTableCard() {
    const t = this.state.card && this.cardTable(), seatW = this.state.cardOpen && this.state.cardOpen.seatNo ? this.seatEntry() : null;
    const kind = !t ? null : t.status === 'empty' || seatW ? 'open' : t.pending ? 'pending' : t.status === 'seated' ? 'form' : t.status === 'leaving' ? 'done' : 'paid';
    const hasForm = kind === 'form' || kind === 'open', hasClear = kind === 'form' || kind === 'done' || (kind === 'pending' && t.status === 'leaving');
    const host = $('tableCard'), shell = !t ? '' :
      // 開桌彈窗只能按「取消」關閉，點遮罩不關；候位開桌點遮罩回到選桌模式
      `<div class="tc-scrim" id="tcScrim"${kind === 'open' && !seatW ? '' : ' data-act="tcClose"'}></div>` +
      // 候位開桌沿用選桌模式的提示列（不另建）
      (seatW ? '' : `<div class="tc-hint" id="tcHint"><span>${kind === 'open' ? `開桌 – ${t.name}` : `查看${t.name}`}</span><div class="tc-hint-btn" data-act="tcClose">取消</div></div>`) +
      `<div class="tc-panel${kind === 'open' ? ' is-open' : ''}" id="tcPanel">` +
        (kind === 'open' ? this.openCardHTML(t, seatW) :
        `<div class="tc-nav">${hasClear ? `<div class="tc-nav-btn is-danger" data-act="tcClearAsk">清桌</div>` : `<div class="tc-nav-spacer"></div>`}` +
          `<div class="tc-nav-title"><span class="tc-status"><span class="tc-status-dot" style="background:${ST[t.status].dot}"></span>${ST[t.status].label}</span><span class="tc-opened" id="tcOpened"></span></div>` +
          `<div class="tc-nav-btn">QR Code</div></div>` +
        (kind === 'done' ? `<div class="tc-body is-done"><div class="tc-done-img"></div><div class="tc-done-text">已出餐完畢且結清帳單</div><div class="tc-done-btn" data-act="tcClearAsk">清桌</div></div>` :
        kind !== 'form' ? `<div class="tc-body is-order">${this.orderCard(t, kind === 'pending')}</div>` :
        `<div class="tc-body">${this.cardFormHTML(false)}</div>`) +
        `<div class="tc-footer"><div class="nav-btn nav-btn-secondary" data-act="tcSwap">換桌</div><div class="nav-btn nav-btn-primary">點餐</div></div>`) +
        `<div class="slot" id="tcToast"></div>` +
      `</div>`;
    const fresh = host._html !== shell;
    html(host, shell);
    // 清桌確認 Alert（iOS 原生樣式，同取消候位）：有待確認訂單時多一行
    html($('clearAlert'), !t || this.state.clearAsk !== t.id ? '' :
      `<div class="ios-alert-scrim"><div class="ios-alert">` +
        `<div class="ios-alert-body"><div class="ios-alert-title">確認清桌？</div>` +
          `<div class="ios-alert-msg">確認${t.name}清桌？桌位將即時釋放${t.pending ? '\n該桌的 1 張待確認訂單將一併取消' : ''}</div></div>` +
        `<div class="ios-alert-actions"><div class="ios-alert-btn" data-act="tcClearCancel">取消</div><div class="ios-alert-btn is-destructive" data-act="tcClearConfirm">確認清桌</div></div>` +
      `</div></div>`);
    if (!t) return;
    if (fresh && kind === 'form') { const c = t.cust; $('tcName').value = c.name; $('tcPhone').value = c.phone; $('tcNote').value = c.note; }
    // 提示列接在篩選列下方；桌卡在提示列下方 20px 起、距畫面底 60px；空桌桌卡高度依內容，在此範圍內垂直置中
    const top = this.state.safeTopPx + CHROME_H, cardTop = top + 52 + 20, maxH = this.state.screenH - 60 - cardTop;
    // 候位開桌：遮罩蓋住整個畫面（含提示列）
    setStyle($('tcScrim'), { top: seatW ? '0px' : top + 'px' });
    if (!seatW) setStyle($('tcHint'), { top: top + 'px' });
    // 候位開桌：提示列被遮罩蓋住，視窗改在狀態列以下區域置中（上下至少 20px，同新增候位視窗）
    const contentH = this.state.screenH - this.state.safeTopPx;
    setStyle($('tcPanel'), seatW ? { top: this.state.safeTopPx + contentH / 2 + 'px', maxHeight: contentH - 40 + 'px' }
      : kind === 'open' ? { top: cardTop + maxH / 2 + 'px', maxHeight: maxH + 'px' } : { top: cardTop + 'px', height: maxH + 'px' });
    html($('tcToast'), this.state.cardToast ? `<div class="wla-toast">${typeof this.state.cardToast === 'string' ? this.state.cardToast : '已套用會員資料'}</div>` : '');
    if (kind !== 'open') {
      // 開桌時間＝現在時間－用餐分鐘數
      const d = new Date(Date.now() - t.mins * 60000), pad = n => String(n).padStart(2, '0');
      html($('tcOpened'), `${pad(d.getHours())}:${pad(d.getMinutes())} 開桌`);
    }
    if (!hasForm) return;
    if (kind === 'open') {
      const o = this.state.cardOpen;
      $('tcPanel').classList.toggle('is-adv', o.adv);
      Object.keys(o.toggles).forEach(k => $('tcToggle-' + k).classList.toggle('is-on', o.toggles[k]));
      if (seatW) {
        // 超過座位數提示（空桌與有人桌皆顯示）；有人桌另有本桌會員（可切換，同 R52 樣式）
        const sum = (t.status === 'empty' ? 0 : t.guests ?? 0) + seatW.people;
        html($('seatPick'), (t.status === 'empty' ? '' : memberSwap(this.seatChoices(t, seatW), o.member, 'seatMember')) +
          (sum > t.cap ? `<div class="mv-warn">加入後 ${sum} 人，超過座位數</div>` : ''));
        return;
      }
      $('tcExpand').classList.toggle('is-collapsed', !o.expanded);
      if (!TC_GUEST_REQUIRED) {
        $('tcExpandBtn').classList.toggle('is-open', o.expanded);
        html($('tcExpandText'), o.expanded ? '收合顧客資料' : '填寫顧客資料');
      }
    }
    const f = this.cardForm(), m = f.member;
    // 套用會員後收合姓名、手機與「選擇會員」，展開會員卡片；清除時反向（清除時保留卡片內容，讓收合動畫期間仍看得到）
    $('tcMemberSwap').classList.toggle('is-collapsed', !m);
    $('tcManualSwap').classList.toggle('is-collapsed', !!m);
    if (m) html($('tcMemberCard'),
      `<div class="wla-member-card">` +
        `<div class="wla-member-info" data-act="memInfoOpen" data-from="card">` +
          `<div class="wla-member-name"><span>👤</span><span>${m.name}</span><span class="wla-member-badge">${m.level}</span></div>` +
          `<div class="wla-member-phone">${m.phone}</div>` +
        `</div>` +
        `<div class="wla-member-actions"><div class="wla-member-btn" data-act="tcMember">更換</div><div class="wla-member-divider"></div><div class="wla-member-btn is-muted" data-act="tcUnlink">清除</div></div>` +
      `</div>`);
    html($('tcTitles'), WLA_TITLES.map(x =>
      `<div class="wla-chip${f.title === x ? ' is-active' : ''}" data-act="tcTitle" data-t="${x}">${x}</div>`).join(''));
    const err = kind === 'open' && this.state.cardOpen.error;
    html($('tcGuests'), WLA_GUESTS.map(g =>
      `<div class="wla-guest${g.required && err ? ' is-error' : ''}"><div class="wla-guest-inner">` +
        `<div class="wla-guest-label">${g.label}${g.required ? `<span class="wla-required">必填</span>` : ''}${g.required && err ? `<span class="wla-error-text">請設定人數</span>` : ''}</div>` +
        `<div class="wla-guest-count"><span>${f[g.k]}</span><div class="wla-stepper">` +
          `<div class="wla-step" data-act="tcStep" data-k="${g.k}" data-d="-1">${ICON_MINUS}</div>` +
          `<div class="wla-step" data-act="tcStep" data-k="${g.k}" data-d="1">${ICON_PLUS}</div>` +
        `</div></div>` +
      `</div></div>`).join(''));
    const total = f.adults + f.kids + f.infants;
    html($('tcTotal'), `${total}人`);
    if ($('tcNeeds')) html($('tcNeeds'), this.needsHTML('tc', f.needs));
  }

  // 外框（含輸入框）只在開啟時建立，保留輸入內容；稱謂與來客數另外更新
  renderWaitlistAdd() {
    const a = this.state.wlAdd;
    html($('wlAdd'), !a ? '' :
      `<div class="wla-scrim"></div>` +
      `<div class="wla-panel" id="wlaPanel">` +
        // 編輯模式只換標題與右上按鈕；開啟時是否已有會員決定初始收合狀態（開啟當下不播動畫）
        `<div class="wla-nav"><div class="wla-nav-btn" data-act="wlaCancel">取消</div><div class="wla-nav-title">${a.editNo ? '編輯候位' : '新增候位'}</div><div class="wla-nav-btn" data-act="wlaSubmit">${a.editNo ? '更新' : '加入'}</div></div>` +
        `<div class="wla-body">` +
          `<div class="wla-swap${a.startWithMember ? '' : ' is-collapsed'}" id="wlaMemberSwap"><div class="wla-swap-inner"><div class="wla-card wla-member" id="wlaMemberCard"></div></div></div>` +
          `<div class="wla-swap${a.startWithMember ? ' is-collapsed' : ''}" id="wlaManualSwap"><div class="wla-swap-inner">` +
          `<div class="wla-card wla-contact" id="wlaContact">` +
            `<div class="wla-name-row">` +
              `<label class="wla-field wla-field-name"><span class="wla-field-inner"><span class="wla-field-label">姓名</span><input class="wla-input" id="wlaName" type="text" placeholder="請輸入姓名"></span></label>` +
              `<div class="wla-titles" id="wlaTitles"></div>` +
            `</div>` +
            `<label class="wla-field"><span class="wla-field-inner"><span class="wla-field-label">電話</span><input class="wla-input" id="wlaPhone" type="text" inputmode="tel" placeholder="請輸入電話號碼"></span></label>` +
          `</div>` +
          `<div class="wla-card wla-link" id="wlaLink" data-act="wlmOpen"><span>選擇會員</span>${ICON_CHEVRON}</div>` +
          `</div></div>` +
          `<div><div class="wla-subtitle">來客數</div><div class="wla-card wla-guests" id="wlaGuests"></div></div>` +
          `<div><div class="wla-subtitle">特殊需求設定</div><div class="wla-card wla-tags" id="wlaNeeds"></div></div>` +
          `<div><div class="wla-subtitle">備註</div><div class="wla-card wla-note-wrap"><textarea class="wla-note" id="wlaNote" placeholder="特殊需求、過敏、其他注意事項..."></textarea></div></div>` +
        `</div>` +
        `<div class="slot" id="wlaToast"></div>` +
      `</div>`);
    if (!a) return;
    // 套用會員後收合姓名、手機與「選擇會員」，展開會員卡片；清除時反向（只收合不清空，清除後恢復原本輸入）
    const m = a.member;
    $('wlaMemberSwap').classList.toggle('is-collapsed', !m);
    $('wlaManualSwap').classList.toggle('is-collapsed', !!m);
    // 清除時保留卡片內容，讓收合動畫期間仍看得到
    if (m) html($('wlaMemberCard'),
      `<div class="wla-member-card">` +
        `<div class="wla-member-info" data-act="memInfoOpen" data-from="wla">` +
          `<div class="wla-member-name"><span>👤</span><span>${m.name}</span><span class="wla-member-badge">${m.level}</span></div>` +
          `<div class="wla-member-phone">${m.phone}</div>` +
        `</div>` +
        `<div class="wla-member-actions"><div class="wla-member-btn" data-act="wlmOpen">更換</div><div class="wla-member-divider"></div><div class="wla-member-btn is-muted" data-act="wlaUnlink">清除</div></div>` +
      `</div>`);
    html($('wlaToast'), a.toast ? `<div class="wla-toast">${typeof a.toast === 'string' ? a.toast : '已套用會員資料'}</div>` : '');
    // 編輯候位：視窗建立後帶入文字欄位（只做一次，之後保留使用者輸入）
    if (this.wlaPrefill) {
      const f = this.wlaPrefill; this.wlaPrefill = null;
      $('wlaName').value = f.name; $('wlaPhone').value = f.phone; $('wlaNote').value = f.note;
    }
    // 狀態列以下的區域置中；畫面太矮時縮短高度（內容可捲動），上下至少留 20px
    const contentH = this.state.screenH - this.state.safeTopPx, h = Math.min(620, contentH - 40);
    setStyle($('wlaPanel'), { top: this.state.safeTopPx + (contentH - h) / 2 + 'px', height: h + 'px' });
    html($('wlaNeeds'), this.needsHTML('wla', a.needs));
    html($('wlaTitles'), WLA_TITLES.map(t =>
      `<div class="wla-chip${a.title === t ? ' is-active' : ''}" data-act="wlaTitle" data-t="${t}">${t}</div>`).join(''));
    html($('wlaGuests'), WLA_GUESTS.map(g =>
      `<div class="wla-guest${g.required && a.error ? ' is-error' : ''}"><div class="wla-guest-inner">` +
        `<div class="wla-guest-label">${g.label}${g.required ? `<span class="wla-required">必填</span>` : ''}${g.required && a.error ? `<span class="wla-error-text">請設定人數</span>` : ''}</div>` +
        `<div class="wla-guest-count"><span>${a[g.k]}</span><div class="wla-stepper">` +
          `<div class="wla-step" data-act="wlaStep" data-k="${g.k}" data-d="-1">${ICON_MINUS}</div>` +
          `<div class="wla-step" data-act="wlaStep" data-k="${g.k}" data-d="1">${ICON_PLUS}</div>` +
        `</div></div>` +
      `</div></div>`).join(''));
  }

  // 外框只在開啟／關閉時重建（保留搜尋框焦點），清單內容隨搜尋更新
  renderWaitlist() {
    const wl = this.state.waitlist, cls = wl && wl.closing ? ' wl-closing' : '';
    html($('waitlist'), !wl ? '' :
      `<div class="wl-scrim${cls}" data-act="closeWaitlist"></div>` +
      `<div class="wl-panel${cls}" style="right:${wl.right}px">` +
        `<div class="wl-arrow"></div>` +
        `<div class="wl-head"><div class="wl-head-spacer"></div><div class="wl-title">候位清單</div><div class="wl-text-btn" data-act="wlaOpen">新增</div></div>` +
        `<div class="wl-search"><label class="wl-search-field">${ICON_SEARCH}` +
          `<input class="wl-search-input" type="text" inputmode="numeric" placeholder="搜尋「候位流水號」或「電話後三碼」"></label></div>` +
        `<div class="wl-list" id="wlList"></div>` +
      `</div>`);
    if (!wl) return;
    const items = this.waitlistItems();
    html($('wlList'), !items.length ? `<div class="wl-empty">找不到符合的候位</div>` : items.map(w =>
      `<div class="wl-row" data-no="${w.no}">` +
      `<div class="wl-actions">` +
        `<div class="wl-action wl-action-edit" data-act="wlaEdit" data-no="${w.no}" role="button" aria-label="編輯">${ICON_SWIPE_EDIT}</div>` +
        `<div class="wl-action wl-action-qr" role="button" aria-label="補印 QRcode">${ICON_SWIPE_PRINT}</div>` +
        `<div class="wl-action wl-action-cancel" data-act="wlCancelAsk" data-no="${w.no}" role="button" aria-label="取消候位">${ICON_SWIPE_TRASH}</div>` +
      `</div>` +
      `<div class="wl-item">` +
        `<div class="wl-num">${w.no}</div>` +
        `<div class="wl-info">` +
          `<div class="wl-name-row">${w.name ? `<span class="wl-name">${w.member ? '<span>👤</span>' : ''}<span>${w.name}</span></span>` : ''}<span>${w.people}人</span>${w.pending ? `<span class="wl-pending">待確認訂單</span>` : ''}</div>` +
          (w.phone ? `<div class="wl-phone">${w.phone}</div>` : '') +
          `<div class="wl-meta"><span>已等 ${w.mins} 分</span>` +
            (w.ahead === 0 ? `<span class="wl-hl">下一組</span>` : `<span>前方還有 <span class="wl-hl">${w.ahead}</span> 組</span>`) +
          `</div>` +
        `</div>` +
        `<div class="wl-text-btn" data-act="wlSeat" data-no="${w.no}">開桌</div>` +
      `</div></div>`).join(''));
    // 滑開狀態以 class 切換（不重建列），收合／展開才有動畫
    document.querySelectorAll('.wl-row').forEach(r => r.classList.toggle('is-open', r.dataset.no === this.state.wlSwipe));
    const c = this.state.wlCancel, cw = c && this.state.wlData.find(w => w.no === c.no);
    html($('wlCancel'), !cw ? '' :
      `<div class="ios-alert-scrim"><div class="ios-alert">` +
        `<div class="ios-alert-body"><div class="ios-alert-title">取消候位</div>` +
          `<div class="ios-alert-msg">確認取消 ${cw.no} 的候位？${cw.pendingCount ? `\n該桌的 ${cw.pendingCount} 張待確認訂單將一併取消` : ''}</div></div>` +
        `<div class="ios-alert-actions"><div class="ios-alert-btn" data-act="wlCancelClose">返回</div><div class="ios-alert-btn is-destructive" data-act="wlCancelConfirm">取消候位</div></div>` +
      `</div></div>`);
  }

  // 桌位圖顯示設定選單：第一層兩個入口，第二層為單選清單
  renderSettings() {
    const { settings: page, timerMode, headerFmt } = this.state;
    const sub = (title, items, cur, act, gap) =>
      `<div class="settings-head"><div class="settings-back" data-act="settingsPage" data-p="root">${ICON_MENU_BACK}</div>${title}</div>` +
      (gap ? `<div class="settings-gap"></div>` : '') +
      `<div>${items.map(o => `<div class="settings-row${cur === o.k ? ' is-active' : ''}" data-act="${act}" data-k="${o.k}">` +
        `<div class="settings-check">${ICON_CHECK}</div><div class="settings-label">${o.label}</div></div>`).join('')}</div>`;
    html($('settingsMenu'), !page ? '' :
      `<div class="settings-menu"><div class="settings-arrow"></div><div class="settings-card${page === 'root' ? ' settings-root' : ''}">` +
      (page === 'root' ?
        `<div class="settings-head">桌位圖顯示設定</div>` +
        `<div>${[{ p: 'timer', label: '佔桌計時模式' }, { p: 'header', label: '訂單抬頭顯示格式' }].map(r =>
          `<div class="settings-row" data-act="settingsPage" data-p="${r.p}"><div class="settings-check"></div>` +
          `<div class="settings-label"><span class="settings-label-text">${r.label}</span>${ICON_MENU_NEXT}</div></div>`).join('')}</div>` :
      page === 'timer' ? sub('佔桌計時模式', TIMER_MODES, timerMode, 'timerMode', false) :
        sub('訂單抬頭顯示格式', HEADER_FORMATS, headerFmt, 'headerFmt', true)) +
      `</div></div>`);
  }

  // 標籤下拉的勾選數量、右側符合桌數、標籤選單
  renderTagFilter(total) {
    const { tagMenu, tags } = this.state, btn = $('tagBtn');
    html($('tagCount'), tags.length ? `<span class="dropdown-count">${tags.length}</span>` : '');
    html($('filterTotal'), total);
    html($('tagMenu'), !tagMenu ? '' :
      `<div class="tag-menu" style="left:${btn.offsetLeft + 17}px;top:${btn.offsetTop + btn.offsetHeight + 6}px"><div class="settings-arrow"></div><div class="settings-card">` +
        `<div class="settings-head">標籤</div><div class="settings-gap"></div>` +
        `<div class="tag-list">${TAGS.map(g => `<div class="tag-chip${tags.includes(g) ? ' is-active' : ''}" data-act="tag" data-t="${g}">${tags.includes(g) ? `<span class="tag-chip-check">${ICON_CHECK}</span>` : ''}${g}</div>`).join('')}</div>` +
      `</div></div>`);
  }

  // 座位數下拉文字與座位數選單（單選，同桌位圖顯示設定選單的勾選列）
  renderSeatFilter() {
    const { seatMenu, seatFilter } = this.state, btn = $('seatBtn'), cur = SEAT_RANGES.find(r => r.k === seatFilter);
    html($('seatLabel'), cur ? `座位數（${cur.label}）` : '座位數');
    html($('seatMenu'), !seatMenu ? '' :
      `<div class="seat-menu" style="left:${btn.offsetLeft + 44}px;top:${btn.offsetTop + btn.offsetHeight + 6}px"><div class="settings-arrow"></div><div class="settings-card">` +
        `<div class="settings-head">座位數</div><div class="settings-gap"></div>` +
        `<div>${SEAT_RANGES.map(r => `<div class="settings-row${seatFilter === r.k ? ' is-active' : ''}" data-act="seatPick" data-k="${r.k}">` +
          `<div class="settings-check">${ICON_CHECK}</div><div class="settings-label">${r.label}</div></div>`).join('')}</div>` +
      `</div></div>`);
  }

  // 桌位元素依索引沿用，讓 transform／陰影／透明度／底色的 transition 能正常播放
  renderTables(items) {
    const host = $('tables');
    while (host.children.length > items.length) host.lastChild.remove();
    while (host.children.length < items.length) { const el = document.createElement('div'); el.className = 'table'; host.appendChild(el); }
    items.forEach((t, i) => {
      const el = host.children[i];
      el.dataset.i = i;
      setStyle(el, {
        left: t.left + 'px', top: t.top + 'px', width: t.size + 'px', height: t.size + 'px',
        borderRadius: t.radius, background: t.bg, border: t.border, color: t.color,
        opacity: String(t.opacity), transform: `scale(${t.scale})`, boxShadow: t.shadow,
      });
      el.classList.toggle('is-seat-target', t.seatTarget);
      html(el,
        (t.isEmpty ? tableDash(t.size, t.radius) : '') +
        (t.isEmpty ? `<img class="table-plus" src="${ICON.plus}" width="32" height="32" alt="" draggable="false">` : '') +
        `<div class="table-name">${t.name}</div>` +
        (t.time && t.time.text ? `<div class="table-time">${ICON_CLOCK}${t.time.text}</div>` : '') +
        `<div class="table-guests"><img class="table-guests-icon" src="${t.userIcon}" width="16" height="16" alt="" draggable="false">${t.guestsText}</div>` +
        (t.pending ? `<div class="table-pending">待確認</div>` : '') +
        (t.time && t.time.over ? `<div class="table-overtime">${ICON_ALARM}超 ${t.time.over} 分</div>` : '') +
        (t.badge ? `<div class="table-badge">${t.badge}</div>` : ''));
    });
  }
}

new Component().componentDidMount();
</script>
</body></html>
